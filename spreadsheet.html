<section id="view-spreadsheet" class="view hidden">
  <div class="view-header">
    <h1>Таблиця товарів</h1>
    <div class="view-actions">
      <div class="product-picker" style="width:260px">
        <input type="text" id="ssJumpSearchInput" placeholder="🔍 Знайти товар і перейти до нього..." autocomplete="off">
        <div id="ssJumpSearchResults" class="product-picker-results hidden"></div>
      </div>
      <button class="btn btn-secondary" id="ssSelectModeBtn">☑ Обрати рядки</button>
      <label class="checkbox-row hidden" id="ssSelectAllRow"><input type="checkbox" id="ssSelectAllCheckbox"> Обрати всі</label>
      <button class="btn btn-danger hidden" id="ssDeleteSelectedBtn">🗑 Видалити обрані (<span id="ssDeleteCount">0</span>)</button>
      <button class="btn btn-secondary" id="ssColumnsVisibilityBtn">👁 Колонки</button>
      <button class="btn btn-secondary" id="ssAddProductBtn">+ Новий товар</button>
      <button class="btn btn-primary" id="ssPrintExportBtn">🖨 Друк / Експорт</button>
    </div>
  </div>
  <p class="muted">Клікніть на будь-яку клітинку, щоб змінити значення — зберігається автоматично одразу після виходу з поля. Таблицю можна гортати вбік — колонок багато.</p>

  <div class="filters-row" id="ssFiltersRow">
    <select id="ssFilterCategory"><option value="">Категорія: всі</option></select>
    <select id="ssFilterProductGroup"><option value="">Товарна група: всі</option></select>
    <select id="ssFilterFamily"><option value="">Сімейство: всі</option></select>
    <select id="ssFilterType"><option value="">Тип: всі</option></select>
    <select id="ssFilterKind"><option value="">Вид: всі</option></select>
    <select id="ssFilterManufacturer"><option value="">Виробник: всі</option></select>
    <select id="ssFilterStatus"><option value="">Статус: всі</option></select>
    <select id="ssFilterCountryOfOrigin"><option value="">Країна: всі</option></select>
    <button class="btn btn-secondary btn-small" id="ssClearFiltersBtn">✕ Скинути фільтри</button>
  </div>

  <div class="table-wrap ss-table-wrap">
    <table class="data-table ss-table">
      <thead id="ssTableHead"></thead>
      <tbody id="ssTableBody"></tbody>
    </table>
  </div>
</section>

<!-- Модалка друку/експорту таблиці -->
<div id="ssExportModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <button class="modal-close" data-close="ssExportModal">✕</button>
    <h2>Друк / Експорт таблиці</h2>

    <h3>Які позиції</h3>
    <div class="inline-row">
      <label class="checkbox-row"><input type="radio" name="ssRowScope" value="all" checked> Усі товари</label>
      <label class="checkbox-row"><input type="radio" name="ssRowScope" value="selected"> Тільки обрані (<span id="ssSelectedCount">0</span>)</label>
    </div>

    <h3>Які колонки</h3>
    <div class="inline-row">
      <button type="button" class="btn btn-secondary btn-small" id="ssColsAllBtn">Обрати всі</button>
      <button type="button" class="btn btn-secondary btn-small" id="ssColsNoneBtn">Зняти всі</button>
      <button type="button" class="btn btn-secondary btn-small" id="ssColsBasicBtn">Тільки базові</button>
    </div>
    <div id="ssColumnCheckboxes" class="ss-col-checks"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="ssExportExcelBtn">⬇ Excel</button>
      <button class="btn btn-secondary" id="ssExportPdfBtn">🖨 PDF (друк)</button>
    </div>
  </div>
</div>

<!-- Друкована сторінка (для PDF через друк браузера) -->
<div id="ssPrintModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <button class="modal-close" data-close="ssPrintModal">✕</button>
    <h2>Друк таблиці</h2>
    <div class="print-actions">
      <button class="btn btn-primary" onclick="printSpreadsheet_()">🖨 Друкувати / Зберегти як PDF</button>
    </div>
    <div id="ssPrintArea"></div>
  </div>
</div>

<!-- Видимість колонок у таблиці -->
<div id="ssColumnsModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" data-close="ssColumnsModal">✕</button>
    <h2>Які колонки показувати</h2>
    <div class="inline-row">
      <button type="button" class="btn btn-secondary btn-small" id="ssVisAllBtn">Показати всі</button>
      <button type="button" class="btn btn-secondary btn-small" id="ssVisBasicBtn">Тільки базові</button>
    </div>
    <div id="ssVisibilityCheckboxes" class="ss-col-checks"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="ssColumnsDoneBtn">Готово</button>
    </div>
  </div>
</div>
