<section id="view-shipments" class="view hidden">
  <div class="view-header">
    <h1>Відвантаження</h1>
    <button class="btn btn-primary" id="addShipmentBtn">+ Нове відвантаження</button>
  </div>

  <div class="filters-row">
    <select id="shipmentStatusFilter">
      <option value="">Усі статуси</option>
      <option value="shipped">🚚 Відправлено</option>
      <option value="delivered">✅ Доставлено</option>
    </select>
  </div>

  <div id="shipmentsGrid" class="products-grid"></div>
</section>

<div id="shipmentModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <button class="modal-close" data-close="shipmentModal">✕</button>
    <h2>Нове відвантаження</h2>

    <div class="inline-row">
      <div class="field-half">
        <label>Перевізник</label>
        <input id="shCarrierInput" type="text">
      </div>
      <div class="field-half">
        <label>№ ТТН</label>
        <input id="shWaybillInput" type="text">
      </div>
    </div>
    <div class="inline-row">
      <div class="field-half">
        <label>К-сть місць</label>
        <input id="shPackageCountInput" type="number" step="1">
      </div>
      <div class="field-half">
        <label>Вага (кг)</label>
        <input id="shWeightInput" type="number" step="any">
      </div>
    </div>
    <label>Габарити</label>
    <input id="shDimensionsInput" type="text" placeholder="напр. 120×80×60 см">
    <label>Дата відправлення</label>
    <input id="shShipDateInput" type="date">
    <label>Фото упаковки (необов'язково)</label>
    <input type="file" id="shPhotoInput" accept="image/*">

    <h3>Готові вироби (за серійним номером)</h3>
    <div id="shSerialsList"></div>
    <div class="inline-row">
      <input id="shSerialInput" type="text" placeholder="Серійний номер (напр. SN-000001)">
      <button type="button" class="btn btn-secondary btn-small" id="addShSerialBtn">+ Додати</button>
    </div>

    <label>Коментар</label>
    <textarea id="shCommentInput" rows="2"></textarea>

    <div class="modal-actions">
      <button class="btn btn-primary" id="saveShipmentBtn">Створити відвантаження</button>
    </div>
  </div>
</div>

<div id="shipmentViewModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" data-close="shipmentViewModal">✕</button>
    <h2 id="shViewTitle"></h2>
    <div id="shViewBody"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="shMarkDeliveredBtn">✅ Позначити доставленим</button>
      <button class="btn btn-danger" id="shDeleteBtn">🗑 Видалити</button>
    </div>
  </div>
</div>
