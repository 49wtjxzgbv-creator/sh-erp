<div id="productModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <button class="modal-close" data-close="productModal">✕</button>
    <h2 id="productModalTitle">Товар</h2>

    <div class="product-form-grid">
      <div class="product-photo-col">
        <img id="productPhotoPreview" class="product-photo" src="" alt="Фото товару">
        <div class="photo-actions" id="photoActionsBlock">
          <label class="btn btn-secondary btn-small">
            📷 Завантажити фото
            <input type="file" id="photoFileInput" accept="image/*" capture="environment" class="hidden">
          </label>
          <button class="btn btn-danger btn-small" id="deletePhotoBtn">Видалити фото</button>
        </div>
        <div class="article-badge" id="articleBadgeBlock">
          <span class="muted">Артикул</span>
          <div id="productArticleBig" class="article-big"></div>
        </div>
      </div>

      <div class="product-fields-col">
        <input type="hidden" id="productIdField">

        <h3 class="field-section-title">Основне</h3>
        <div class="inline-row">
          <div class="field-half"><label>Артикул</label><input id="fieldArticle" type="text"></div>
          <div class="field-half"><label>Код</label><input id="fieldCode" type="text"></div>
        </div>
        <label>Назва</label>
        <input id="fieldName" type="text">
        <label>Опис</label>
        <textarea id="fieldDescription" rows="2"></textarea>
        <label>Штрих-код</label>
        <input id="fieldBarcode" type="text">

        <h3 class="field-section-title">Класифікація</h3>
        <div class="inline-row">
          <div class="field-half"><label>Категорія</label><input id="fieldCategory" type="text" list="categoryList"><datalist id="categoryList"></datalist></div>
          <div class="field-half"><label>Товарна група</label><input id="fieldProductGroup" type="text" list="productGroupList"><datalist id="productGroupList"></datalist></div>
        </div>
        <div class="inline-row">
          <div class="field-half"><label>Сімейство</label><input id="fieldFamily" type="text" list="familyList"><datalist id="familyList"></datalist></div>
          <div class="field-half"><label>Тип</label><input id="fieldType" type="text" list="typeList"><datalist id="typeList"></datalist></div>
        </div>
        <div class="inline-row">
          <div class="field-half"><label>Вид</label><input id="fieldKind" type="text" list="kindList"><datalist id="kindList"></datalist></div>
          <div class="field-half"><label>Виріб</label><input id="fieldProductLine" type="text"></div>
        </div>

        <h3 class="field-section-title">Склад і облік</h3>
        <div class="inline-row">
          <div class="field-half">
            <label>Одиниця виміру</label>
            <div class="inline-row"><select id="fieldUnit"></select><button type="button" class="btn btn-secondary btn-small" id="addUnitBtn">+</button></div>
          </div>
          <div class="field-half"><label>К-сть в упаковці</label><input id="fieldUnitsPerPackage" type="number" step="any"></div>
        </div>
        <label>Місце зберігання (комірка)</label>
        <input id="fieldCell" type="text">
        <div class="inline-row">
          <div class="field-half"><label>Залишок</label><input id="fieldQty" type="number" step="any"></div>
          <div class="field-half"><label>Мінімальний залишок</label><input id="fieldMinQty" type="number" step="any"></div>
        </div>
        <div id="computedStockInfo" class="computed-info"></div>

        <label>Постачальник за замовчуванням</label>
        <select id="fieldDefaultSupplierId"><option value="">— не призначено —</option></select>

        <h3 class="field-section-title" id="priceSectionTitle">Ціни постачальників</h3>
        <div class="inline-row" id="priceFieldsRow">
          <div class="field-half"><label>Наша — без ПДВ (EUR)</label><input id="fieldLocalPriceExcl" type="number" step="any"></div>
          <div class="field-half"><label>Наша — з ПДВ (EUR)</label><input id="fieldLocalPriceIncl" type="number" step="any"></div>
        </div>
        <div class="inline-row" id="priceFieldsRow2">
          <div class="field-half"><label>Німецька — без ПДВ (EUR)</label><input id="fieldGermanPriceExcl" type="number" step="any"></div>
          <div class="field-half"><label>Німецька — з ПДВ (EUR)</label><input id="fieldGermanPriceIncl" type="number" step="any"></div>
        </div>
        <div class="inline-row" id="sellPriceRow">
          <div class="field-half"><label>Ціна продажу (EUR)</label><input id="fieldSellPrice" type="number" step="any"></div>
        </div>
        <div id="computedPriceInfo" class="computed-info"></div>

        <h3 class="field-section-title">Виробник і додатково</h3>
        <div class="inline-row">
          <div class="field-half"><label>Виробник</label><input id="fieldManufacturer" type="text" list="manufacturerList"><datalist id="manufacturerList"></datalist></div>
          <div class="field-half"><label>Код виробника</label><input id="fieldManufacturerCode" type="text"></div>
        </div>
        <div class="inline-row">
          <div class="field-half"><label>Країна виробника</label><input id="fieldCountryOfOrigin" type="text" list="countryList"><datalist id="countryList"></datalist></div>
          <div class="field-half"><label>Термін гарантії</label><input id="fieldWarrantyMonths" type="text" placeholder="напр. 12 місяців"></div>
        </div>
        <div class="inline-row">
          <div class="field-half"><label>Статус</label><input id="fieldStatus" type="text" list="statusList" placeholder="напр. Активний"><datalist id="statusList"></datalist></div>
          <div class="field-half"><label>Вага за од. (кг)</label><input id="fieldWeightPerUnit" type="number" step="any"></div>
        </div>
        <label>Прайс-лист (посилання/назва)</label>
        <input id="fieldPriceListRef" type="text">
        <label>Примітка</label>
        <textarea id="fieldNote" rows="2"></textarea>

        <div class="modal-actions">
          <button class="btn btn-primary" id="saveProductBtn">Зберегти</button>
          <button class="btn btn-danger" id="deleteProductBtn">Видалити товар</button>
        </div>
      </div>
    </div>

    <div class="stock-ops" id="stockOpsBlock">
      <h3>Складські операції</h3>
      <div class="stock-ops-row">
        <input type="number" id="opQty" placeholder="Кількість" step="any">
        <input type="text" id="opComment" placeholder="Коментар (необов'язково)">
        <select id="opWarehouseSelect"><option value="">Склад: не вказувати</option></select>
        <button class="btn btn-secondary" id="opReceiveBtn">⬇ Прихід</button>
        <button class="btn btn-secondary" id="opIssueBtn">⬆ Видача</button>
        <button class="btn btn-danger" id="opDefectBtn">🗑 Списати брак</button>
      </div>
      <div class="stock-ops-row">
        <input type="text" id="opNewCell" placeholder="Нова комірка">
        <button class="btn btn-secondary" id="opMoveBtn">↔ Перемістити</button>
        <input type="number" id="opAdjustQty" placeholder="Точний залишок" step="any">
        <button class="btn btn-secondary" id="opAdjustBtn">✓ Коригувати</button>
      </div>
      <div id="warehouseBreakdownBlock" class="simple-list"></div>
    </div>

    <div class="product-history-block">
      <h3>Історія цього товару</h3>
      <div id="productHistoryList" class="simple-list"></div>
    </div>
  </div>
</div>

<!-- Модалка додавання одиниці виміру -->
<div id="addUnitModal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" data-close="addUnitModal">✕</button>
    <h2>Нова одиниця виміру</h2>
    <input id="newUnitName" type="text" placeholder="Наприклад: пара">
    <div class="modal-actions">
      <button class="btn btn-primary" id="saveUnitBtn">Додати</button>
    </div>
  </div>
</div>
