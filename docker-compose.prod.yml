# Production Postgres for the Hostinger VPS deployment path
# (docs/deployment.md's "Hostinger VPS (native systemd)" section).
#
# REAL ARCHITECTURE CHANGE (2026-08-05 production-readiness audit): this
# file used to also build and run `backend`/`frontend` as containers. That
# was retired — not patched again — after three consecutive real
# production incidents that were all fundamentally "fighting Docker, not
# fighting this app": root-owned node_modules under a non-root USER
# (chown), a Debian-slim image missing libssl for Prisma's engine, and a
# standalone Next.js build silently missing its own static assets unless
# someone remembered to `docker cp` them in. None of those problems exist
# for a native process managed by systemd (ops/systemd/*.service) — the
# process runs as the exact same OS user that owns its own files, uses
# whatever OpenSSL the host already has, and `npm run build`'s `postbuild`
# hook (frontend/scripts/copy-standalone-static.js) is a normal filesystem
# operation with no container-layer boundary to cross. Postgres, by
# contrast, has no build step and no code of ours running inside it — the
# official `postgres:16` image has none of those failure modes, so it stays
# exactly where it was.
#
# Bring it up with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# `.env.prod` here is intentionally minimal (just POSTGRES_SUPERUSER* and
# R2 backup credentials for ops/backup-postgres.sh) — it is NOT the same
# file as /etc/sh-erp/backend.env or /etc/sh-erp/frontend.env, which hold
# the application's own configuration and are read by systemd directly, not
# by Docker Compose. See docs/deployment.md's env-var checklist for the
# full picture of which file holds what.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: sh_erp
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sh-erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d sh_erp']
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted, S3-compatible object storage (2026-08-07) — a drop-in
  # substitute for Cloudflare R2 for a deployment that has no card/external
  # account on file. backend/src/modules/files/r2-client.ts is a plain AWS
  # SDK S3Client configured entirely from R2_ENDPOINT/R2_ACCESS_KEY_ID/
  # R2_SECRET_ACCESS_KEY env vars — no code change needed, MinIO just gets
  # pointed to instead of Cloudflare's endpoint. Bound to 127.0.0.1 only,
  # same as postgres above: only the backend process on this host ever
  # talks to it, never exposed publicly.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The official image's own Dockerfile sets these to "access_key"/
      # "secret_key" by default (a Docker-secrets-file convention) — when
      # set, MinIO's entrypoint prefers them over the direct
      # MINIO_ROOT_USER/PASSWORD values above and silently falls back to a
      # blank/internal identity when the referenced file doesn't exist
      # (found the hard way: correct direct credentials, "Access Denied"
      # on every request). Blanking these two restores the direct vars.
      MINIO_ROOT_USER_FILE: ''
      MINIO_ROOT_PASSWORD_FILE: ''
      MINIO_ACCESS_KEY_FILE: ''
      MINIO_SECRET_KEY_FILE: ''
      MINIO_CONFIG_ENV_FILE: ''
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - sh-erp-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sh-erp-postgres-data:
  sh-erp-minio-data:
