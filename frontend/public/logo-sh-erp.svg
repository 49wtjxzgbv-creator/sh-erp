    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="600"
    font-size="26"
    letter-spacing="9"
    fill="#0D1B2A"
  >ERP</text>
  <line x1="95" y1="160" x2="138" y2="160" stroke="#0D1B2A" stroke-width="1.5" />
  <line x1="172" y1="160" x2="215" y2="160" stroke="#0D1B2A" stroke-width="1.5" />
