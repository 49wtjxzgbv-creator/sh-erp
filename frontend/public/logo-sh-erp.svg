       curves, uniform stroke width), not set in a font. -->
  <path
    transform="translate(77.5,10)"
    fill="#0D1B2A"
    d="M0,0 L70,0 L70,20 L20,20 L20,40 L70,40 L70,100 L0,100 L0,80 L50,80 L50,60 L0,60 Z"
  />
  <!-- "H" — same construction. -->
  <path
    transform="translate(162.5,10)"
    fill="#0D1B2A"
    d="M0,0 L20,0 L20,40 L50,40 L50,0 L70,0 L70,100 L50,100 L50,60 L20,60 L20,100 L0,100 Z"
  />
  <text
    x="155"
