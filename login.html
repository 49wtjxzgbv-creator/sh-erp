<div id="loginScreen" class="login-screen">
  <div class="login-bg">
    <div class="login-glow login-glow-top"></div>
    <div class="login-glow login-glow-bottom"></div>
    <div class="login-noise"></div>
  </div>

  <div class="login-center">
    <form id="loginForm" class="login-card">
      <div class="login-logo">SH</div>
      <div class="login-brand">by Shyring</div>

      <h1 class="login-heading">Ласкаво просимо</h1>
      <p class="login-subtitle">Увійдіть, щоб продовжити роботу в SH ERP</p>

      <div class="login-field">
        <span class="login-field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input id="loginInput" type="text" autocomplete="username" placeholder="Логін" required>
      </div>

      <div class="login-field">
        <span class="login-field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Пароль" required>
        <button type="button" class="login-eye-btn" id="toggleLoginPasswordBtn" aria-label="Показати пароль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" class="login-submit-btn">Увійти</button>
      <div id="loginError" class="login-error hidden"></div>

      <div class="login-secondary-links">
        <span></span>
        <a href="#" class="login-link" id="loginHintToggle">Дані для входу</a>
      </div>

      <div id="loginHintBlock" class="login-hint hidden">
        <div>Адмін: <code>admin / admin123</code></div>
        <div>Комірник: <code>sklad / sklad123</code></div>
        <div>Перегляд: <code>view1 / view123</code></div>
      </div>

      <div class="login-footer-line"></div>
      <div class="login-footer-text">Безпечно · Надійно · Ефективно</div>
    </form>
  </div>
</div>
