/* ---------- Ліниве підвантаження важких бібліотек (XLSX/JSZip) ----------
   Вони важать разом майже 1 МБ і потрібні лише для окремих дій (Excel), тож не
   підключені одразу в <head> — це суттєво пришвидшує перше відкриття застосунку. */
var LOADED_SCRIPTS_ = {};
function loadScriptOnce_(url) {
  if (LOADED_SCRIPTS_[url]) return LOADED_SCRIPTS_[url];
  LOADED_SCRIPTS_[url] = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = url;
    script.onload = resolve;
    script.onerror = function () { reject(new Error('Не вдалося завантажити ' + url)); };
    document.head.appendChild(script);
  });
  return LOADED_SCRIPTS_[url];
}
function loadXlsxLib_() { return loadScriptOnce_('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
function loadJsZipLib_() { return loadScriptOnce_('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }

/* ---------- Індикатор виконання для кнопок повільних дій ---------- */
function withButtonLoading_(btn, promise) {
  if (btn) { btn.classList.add('btn-loading'); btn.disabled = true; }
  return promise.finally(function () {
    if (btn) { btn.classList.remove('btn-loading'); btn.disabled = false; }
  });
}

/* ---------- Обгортка google.script.run у Promise ---------- */
/* ---------- Виклик сервера через звичайний fetch(POST), в обхід ненадійного
   iframe-містка google.script.run (детальніше в коментарі до doPost у Code.gs) ---------- */
function call(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);

  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // без preflight-запиту
    body: JSON.stringify({ fn: fnName, args: args })
  })
    .then(function (resp) {
      if (!resp.ok) throw new Error('Сервер повернув статус ' + resp.status + ' для "' + fnName + '".');
      return resp.json();
    })
    .then(function (res) {
      if (res == null) throw new Error('Порожня відповідь сервера для "' + fnName + '".');
      if (res.success === false) throw new Error(res.error);
      return res.data;
    });
}

function toast(message, isError) {
  var el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = 'toast hidden'; }, 3500);
}

/* ---------- Підтвердження видалення через код (замість звичайного confirm())
   ---------- Показує випадковий 4-значний код, який треба вручну ввести й
   натиснути кнопку — так неможливо видалити щось одним випадковим кліком чи
   Enter'ом. Повертає Promise<boolean> (true — підтверджено, false — скасовано). */
function confirmDangerous_(message) {
  return new Promise(function (resolve) {
    var modal = document.getElementById('dangerConfirmModal');
    var input = document.getElementById('dangerConfirmInput');
    var confirmBtn = document.getElementById('dangerConfirmBtn');
    var cancelBtn = document.getElementById('dangerConfirmCancelBtn');
    var code = String(Math.floor(1000 + Math.random() * 9000));

    document.getElementById('dangerConfirmMessage').textContent = message;
    document.getElementById('dangerConfirmCode').textContent = code;
    input.value = '';
    modal.classList.remove('hidden');
    setTimeout(function () { input.focus(); }, 50);

    function cleanup(result) {
      modal.classList.add('hidden');
      confirmBtn.removeEventListener('click', onConfirm);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKeydown);
      resolve(result);
    }
    function onConfirm() {
      if (input.value.trim() !== code) { toast('Код введено невірно.', true); return; }
      cleanup(true);
    }
    function onCancel() { cleanup(false); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); onConfirm(); }
      if (e.key === 'Escape') onCancel();
    }

    confirmBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    input.addEventListener('keydown', onKeydown);
  });
}

/* ---------- Брендування (власні файли логотипу/емблеми) ---------- */
var STATE_BRANDING = { site_logo: '', print_logo: '', favicon: '' };

function loadAndApplyBranding_() {
  call('getBrandingAssets', STATE.token || null).then(function (assets) {
    STATE_BRANDING = assets || {};
    if (STATE_BRANDING.site_logo) {
      document.querySelectorAll('.brand-logo, .login-logo').forEach(function (el) {
        el.innerHTML = '<img src="' + STATE_BRANDING.site_logo + '" style="width:100%;height:100%;object-fit:contain;">';
      });
    }
    if (STATE_BRANDING.favicon) {
      var link = document.querySelector('link[rel="icon"]');
      if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
      link.href = STATE_BRANDING.favicon;
    }
  }).catch(function () {});
}

var BRANDING_ASSET_LABELS_ = { site_logo: 'Логотип сайту', print_logo: 'Емблема для друку', favicon: 'Фавікон' };
function loadBrandingSettings_() {
  call('getBrandingAssets', STATE.token).then(function (assets) {
    STATE_BRANDING = assets || {};
    ['site_logo', 'print_logo', 'favicon'].forEach(function (type) {
      var img = document.getElementById('brand' + toPascalCase_(type) + 'Preview');
      if (STATE_BRANDING[type]) { img.src = STATE_BRANDING[type]; img.classList.remove('hidden'); }
      else { img.classList.add('hidden'); }
    });
  }).catch(function (e) { toast(e.message, true); });
}
function toPascalCase_(s) { return s.split('_').map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(''); }

['site_logo', 'print_logo', 'favicon'].forEach(function (type) {
  var pascal = toPascalCase_(type);
  var input = document.getElementById('brand' + pascal + 'Input');
  var deleteBtn = document.getElementById('delete' + 'Brand' + pascal + 'Btn');
  if (input) {
    input.addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        call('uploadBrandingAsset', STATE.token, type, base64, file.type, file.name).then(function () {
          toast(BRANDING_ASSET_LABELS_[type] + ' завантажено');
          loadBrandingSettings_();
          loadAndApplyBranding_();
        }).catch(function (err) { toast(err.message, true); });
      };
      reader.readAsDataURL(file);
    });
  }
  if (deleteBtn) {
    deleteBtn.addEventListener('click', function () {
      call('deleteBrandingAsset', STATE.token, type).then(function () {
        toast('Прибрано');
        loadBrandingSettings_();
      }).catch(function (e) { toast(e.message, true); });
    });
  }
});

  // САМЕ цей внутрішній URL, який не призначений для прямого відкриття,
  // тому екран стає білим. Натомість переходимо на справжню адресу /exec

(document.getElementById('changePasswordBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  document.getElementById('oldPasswordField').value = '';

  document.getElementById('newPasswordConfirmField').value = '';

  document.getElementById('changePasswordModal').classList.remove('hidden');
});
(document.getElementById('saveNewPasswordBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var oldPass = document.getElementById('oldPasswordField').value;
  var newPass = document.getElementById('newPasswordField').value;
  var confirmPass = document.getElementById('newPasswordConfirmField').value;
  var errEl = document.getElementById('changePasswordError');

  if (!oldPass || !newPass) {
    errEl.textContent = 'Заповніть усі поля.';
    errEl.className = 'error-text';
    return;
  }
  if (newPass !== confirmPass) {
    errEl.textContent = 'Новий пароль і підтвердження не збігаються.';
    errEl.className = 'error-text';
    return;
  }

  call('changeOwnPassword', STATE.token, oldPass, newPass).then(function () {
    toast('Пароль змінено');
    closeModal('changePasswordModal');
  }).catch(function (e) {
    errEl.textContent = e.message;
    errEl.className = 'error-text';
  });
});

function boot() {
  if (!STATE.token) { showLogin(); return; }
  call('checkSession', STATE.token).then(function (data) {
    STATE.user = data.user;
    enterApp();
  }).catch(function () {
    sessionStorage.removeItem('shsklad_token');
    sessionStorage.removeItem('shsklad_user');
    showLogin();
  });
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appShell').classList.add('hidden');
}

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('currentUserLabel').textContent =
    STATE.user.fullName + ' (' + roleLabel(STATE.user.role) + ')';

  applyRolePermissions();

  call('getBootstrapData', STATE.token).then(function (boot) {
    boot = boot || {};
    applyUnitsData_(boot.units || []);
    applyFilterOptionsData_(boot.filterOptions || {});
    applyDashboardWidgetsVisibility_(boot.dashboardWidgets || DASHBOARD_WIDGET_IDS_.slice());
    if (boot.stats) renderDashboardStats_(boot.stats);
  }).catch(function (e) { toast(e.message, true); });

  loadWarehousesList_();
  loadStagesSettings_();
  loadSuppliers_();
  navigateTo(location.hash.replace('#', '') || 'dashboard');
}

function navigateTo(view) {
  document.querySelectorAll('.view').forEach(function (v) { v.classList.add('hidden'); });
  var target = document.getElementById('view-' + view);
  if (!target) { view = 'dashboard'; target = document.getElementById('view-dashboard'); }
  target.classList.remove('hidden');
  location.hash = view;

  document.querySelectorAll('.nav-item').forEach(function (a) {
    a.classList.toggle('active', a.dataset.view === view);
  });

  if (view === 'dashboard') loadDashboard();
  if (view === 'products') loadProducts();
  if (view === 'assemblies') loadAssemblies();
  if (view === 'production') loadProductionOrders();
  if (view === 'spreadsheet') loadSpreadsheet();
  if (view === 'purchases') loadPurchaseOrders();
  if (view === 'warehouses') loadWarehousesPage_();
  if (view === 'reports') loadReports_();
  if (view === 'customerOrders') loadCustomerOrders();
  if (view === 'finishedGoods') loadFinishedGoods();
  if (view === 'inventory') loadInventorySessions();
  if (view === 'shipments') loadShipments();
  if (view === 'employees') loadEmployees();
  if (view === 'payroll') loadPayrollSummary_();
  if (view === 'history') loadHistory();
  if (view === 'settings') loadSettings();
}

function loadProducts(query) {
  var filters = getActiveFilters_();
  var promise = (query || Object.keys(filters).length)
    ? call('searchProducts', STATE.token, query || '', filters)
    : call('listProducts', STATE.token);

  promise.then(function (products) {
    products = products || [];
    STATE.products = products;
    renderProductsGrid(products);
  }).catch(function (e) { toast(e.message, true); });
}

function getActiveFilters_() {
  var ids = ['category', 'productGroup', 'family', 'type', 'kind', 'manufacturer', 'status', 'countryOfOrigin'];
  var filters = {};
  ids.forEach(function (key) {
    var el = document.getElementById('filter' + key.charAt(0).toUpperCase() + key.slice(1));
    if (el && el.value) filters[key] = el.value;
  });
  return filters;
}

function loadFilterOptions() {
  call('getFilterOptions', STATE.token).then(applyFilterOptionsData_).catch(function () { /* фільтри не критичні — мовчки пропускаємо */ });
}
function applyFilterOptionsData_(opts) {
  STATE.filterOptions = opts || {};
  var map = {
    filterCategory: 'category', filterProductGroup: 'productGroup', filterFamily: 'family',
    filterType: 'type', filterKind: 'kind', filterManufacturer: 'manufacturer',
    filterStatus: 'status', filterCountryOfOrigin: 'countryOfOrigin',
    // Ті самі фільтри, але для сторінки "Таблиця товарів" (view-spreadsheet) —
    // окремі select'и (інші id), бо обидва блоки фільтрів існують в DOM одночасно.
    ssFilterCategory: 'category', ssFilterProductGroup: 'productGroup', ssFilterFamily: 'family',
    ssFilterType: 'type', ssFilterKind: 'kind', ssFilterManufacturer: 'manufacturer',
    ssFilterStatus: 'status', ssFilterCountryOfOrigin: 'countryOfOrigin'
  };
  Object.keys(map).forEach(function (selectId) {
    var select = document.getElementById(selectId);
    if (!select) return;
    var current = select.value;
    var values = STATE.filterOptions[map[selectId]] || [];
    select.innerHTML = select.options[0].outerHTML + values.map(function (v) {
      return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
    }).join('');

function fillModalDatalists_() {

    typeList: 'type', kindList: 'kind', manufacturerList: 'manufacturer', countryList: 'countryOfOrigin',
    statusList: 'status'

function renderProductsGrid(products) {
  var grid = document.getElementById('productsGrid');
  if (!products.length) { grid.innerHTML = '<div class="muted">Товарів не знайдено.</div>'; return; }

  var canBulk = STATE.user.role === 'admin';

  grid.innerHTML = products.map(function (p) {
    var low = p.minQty > 0 && p.qty <= p.minQty;
    var photo = p.photoUrl || 'https://via.placeholder.com/300x200?text=Немає+фото';
    var checkbox = (STATE.bulkMode && canBulk)
      ? '<input type="checkbox" class="product-card-checkbox" data-id="' + p.id + '" ' + (STATE.selectedIds[p.id] ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleProductSelect(\'' + p.id + '\', this.checked)">'
      : '';
    var clickHandler = STATE.bulkMode ? '' : ('onclick="openProductModal(\'' + p.id + '\')"');
    return '<div class="product-card" ' + clickHandler + '>' +
      checkbox +
      '<img src="' + photo + '" loading="lazy">' +
      '<div class="name">' + escapeHtml(p.name) + '</div>' +
      '<div class="meta">Арт: <strong class="article-strong">' + escapeHtml(p.article) + '</strong> · ' + escapeHtml(p.category || '—') + '</div>' +

function openProductModal(id) {
  currentProductId = id;
  var isNew = !id;
  document.getElementById('productModalTitle').textContent = isNew ? 'Новий товар' : 'Картка товару';
  document.getElementById('stockOpsBlock').style.display = isNew ? 'none' : '';
  document.querySelector('.product-history-block').style.display = isNew ? 'none' : '';
  document.getElementById('deleteProductBtn').style.display = isNew ? 'none' : '';

  document.getElementById('fieldDefaultSupplierId').innerHTML = '<option value="">— не призначено —</option>' +
    STATE_SUPPLIERS.map(function (s) { return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>'; }).join('');

  var fill = function (p) {
    document.getElementById('productIdField').value = p.id || '';
    Object.keys(TEXT_FIELD_MAP_).forEach(function (elId) {
      document.getElementById(elId).value = p[TEXT_FIELD_MAP_[elId]] || '';
    });
    Object.keys(NUMBER_FIELD_MAP_).forEach(function (elId) {
      var v = p[NUMBER_FIELD_MAP_[elId]];
      document.getElementById(elId).value = (v != null && v !== 0) ? v : (v === 0 ? 0 : '');
    });
    document.getElementById('fieldUnit').value = p.unit || 'шт';
    document.getElementById('fieldQty').value = p.qty != null ? p.qty : 0;
    document.getElementById('productPhotoPreview').src = p.photoUrl || 'https://via.placeholder.com/300x200?text=Немає+фото';
    document.getElementById('productArticleBig').textContent = p.article || '';
    document.getElementById('fieldQty').disabled = !isNew; // залишок міняється лише через операції

    updateComputedInfo_(p);
  };

  if (isNew) {
    fill({});
    document.getElementById('productHistoryList').innerHTML = '';
    document.getElementById('productModal').classList.remove('hidden');
  } else {
    call('getProduct', STATE.token, id).then(function (p) {
      fill(p);
      document.getElementById('productModal').classList.remove('hidden');
      loadProductHistory(p.article);
      loadWarehouseBreakdown_(id);
    }).catch(function (e) { toast(e.message, true); });
  }
}

function updateComputedInfo_(p) {
  var stockEl = document.getElementById('computedStockInfo');

  var priceEl = document.getElementById('computedPriceInfo');
  priceEl.innerHTML = '';
}

(document.getElementById('downloadBulkReceiveTemplateBtn') || {addEventListener:function(){}}).addEventListener('click', function () {

    var products = results[1] || [];
    STATE.products = products; // оновлюємо і загальний кеш, щоб решта екрана теж бачила актуальний список
    var rows = [['Артикул', 'Назва (довідково)', 'Кількість']];
    products.forEach(function (p) {
      rows.push([p.article, p.name, '']);
    });
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 16 }, { wch: 40 }, { wch: 12 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Прихід');
    XLSX.writeFile(wb, 'SHSklad_шаблон_приходу_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }).catch(function (e) { toast(e.message, true); });
});

(document.getElementById('bulkReceiveFileInput') || {addEventListener:function(){}}).addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  loadXlsxLib_().then(function () {
    var reader = new FileReader();
    reader.onload = function (evt) {
      var wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { defval: '', blankrows: true });
      if (!rows.length) { toast('Файл порожній', true); return; }

      var headers = Object.keys(rows[0]);
      var articleHeader = headers.find(function (h) { return /артикул|арт\.?$|код|sku|article/i.test(h); }) || headers[0];
      var qtyHeader = headers.find(function (h) { return /кільк|прихід|qty|quantity|кол-во/i.test(h); }) || headers[1];

      var added = 0;
      rows.forEach(function (row) {
        var article = String(row[articleHeader] || '').trim();
        var qty = parseFloat(String(row[qtyHeader]).replace(',', '.')) || 0;
        if (!article || !qty) return;
        var product = STATE.products.find(function (p) { return String(p.article || '').toLowerCase() === article.toLowerCase(); });
        var existing = STATE_BULK_RECEIVE.find(function (r) { return String(r.article || '').toLowerCase() === article.toLowerCase(); });
        if (existing) { existing.qty += qty; } else {
          STATE_BULK_RECEIVE.push({ article: article, name: product ? product.name : '(не знайдено на складі)', qty: qty });
        }

/**
 * Імпортує рядки пакетами (щоб показувати реальний прогрес і не впертись
 * у ліміти розміру одного запиту, якщо у файлі багато вбудованих фото).
 */
function runChunkedImport_(rows, foundImagesCount) {
  var CHUNK_SIZE = 25;
  var chunks = [];
  for (var i = 0; i < rows.length; i += CHUNK_SIZE) chunks.push(rows.slice(i, i + CHUNK_SIZE));

  var totals = { created: 0, updated: 0, errors: [] };
  var doneChunks = 0;

  function next() {
    if (doneChunks >= chunks.length) {
      setImportProgress_(100, 'Готово!');
      var msg = 'Імпортовано: ' + totals.created + ' нових, ' + totals.updated + ' оновлено' +
        (foundImagesCount ? ', фото знайдено: ' + foundImagesCount : '') +
        (totals.errors.length ? ', помилок: ' + totals.errors.length : '');
      document.getElementById('importProgressResult').innerHTML =
        '<div class="' + (totals.errors.length ? 'error-text' : 'muted') + '">' + msg + '</div>' +
        (totals.errors.length ? '<div class="simple-list">' + totals.errors.slice(0, 15).map(function (e) {
          return '<div class="simple-list-item">' + escapeHtml(e) + '</div>';
        }).join('') + '</div>' : '');
      document.getElementById('closeImportProgressBtn').classList.remove('hidden');
      loadProducts();
      loadFilterOptions();
      return;
    }

    call('importProducts', STATE.token, chunks[doneChunks]).then(function (res) {
      totals.created += res.created;
      totals.updated += res.updated;
      totals.errors = totals.errors.concat(res.errors || []);
      doneChunks++;
      var pct = Math.round(15 + (doneChunks / chunks.length) * 85);
      setImportProgress_(pct, 'Завантажую на сервер: ' + doneChunks + ' з ' + chunks.length + ' частин...');
      next();
    }).catch(function (err) {
      totals.errors.push('Частина ' + (doneChunks + 1) + ': ' + err.message);
      doneChunks++;
      next();
    });
  }
  next();
}

/**
 * Витягує зображення, вбудовані прямо у файл .xlsx (не посилання), і повертає
 * мапу "індекс рядка аркуша (0-based) -> {base64, mimeType}" для першого аркуша.
 * Якщо в файлі немає зображень або структура нетипова — повертає порожню мапу
 * (імпорт продовжується як звичайно, за посиланнями у стовпці "Фото URL").
 */
function extractEmbeddedImages_(arrayBuffer) {
  return JSZip.loadAsync(arrayBuffer).then(function (zip) {
    var result = {};

    return resolveFirstWorksheetPath_(zip).then(function (worksheetFileName) {
      if (!worksheetFileName) return result;
      var sheetRelsFile = zip.file('xl/worksheets/_rels/' + worksheetFileName + '.rels');
      if (!sheetRelsFile) return result;

      return sheetRelsFile.async('text').then(function (sheetRelsXml) {
        var relsDoc = new DOMParser().parseFromString(sheetRelsXml, 'text/xml');
        var drawingRel = Array.from(relsDoc.getElementsByTagName('Relationship'))
          .find(function (r) { return (r.getAttribute('Type') || '').indexOf('drawing') !== -1; });
        if (!drawingRel) return result;

        var drawingPath = 'xl/drawings/' + drawingRel.getAttribute('Target').split('/').pop();
        var drawingFile = zip.file(drawingPath);
        var drawingRelsFile = zip.file('xl/drawings/_rels/' + drawingPath.split('/').pop() + '.rels');
        if (!drawingFile || !drawingRelsFile) return result;

        return Promise.all([drawingFile.async('text'), drawingRelsFile.async('text')]).then(function (r) {
          var drawingXml = r[0], drawingRelsXml = r[1];
          var drawingDoc = new DOMParser().parseFromString(drawingXml, 'text/xml');
          var drawingRelsDoc = new DOMParser().parseFromString(drawingRelsXml, 'text/xml');

          var relIdToTarget = {};
          Array.from(drawingRelsDoc.getElementsByTagName('Relationship')).forEach(function (r) {
            relIdToTarget[r.getAttribute('Id')] = 'xl/media/' + r.getAttribute('Target').split('/').pop();
          });

          var anchors = Array.from(drawingDoc.getElementsByTagName('xdr:twoCellAnchor'))
            .concat(Array.from(drawingDoc.getElementsByTagName('xdr:oneCellAnchor')));

          var imagePromises = [];
          anchors.forEach(function (anchor) {
            var fromRowEl = anchor.getElementsByTagName('xdr:from')[0];
            var rowEl = fromRowEl && fromRowEl.getElementsByTagName('xdr:row')[0];
            var blipEl = anchor.getElementsByTagName('a:blip')[0];
            if (!rowEl || !blipEl) return;

            var rowIndex = parseInt(rowEl.textContent, 10); // 0-based, як в OOXML
            var embedId = blipEl.getAttribute('r:embed');
            var mediaPath = relIdToTarget[embedId];
            var mediaFile = mediaPath && zip.file(mediaPath);
            if (!mediaFile) return;

            var ext = mediaPath.split('.').pop().toLowerCase();
            var mimeType = ext === 'png' ? 'image/png' : (ext === 'gif' ? 'image/gif' : 'image/jpeg');

            imagePromises.push(mediaFile.async('base64').then(function (base64) {
              result[rowIndex] = { base64: base64, mimeType: mimeType };
            }));
          });

          return Promise.all(imagePromises).then(function () { return result; });
        });
      });
    });
  }).catch(function () {
    return {}; // файл без вбудованих зображень або нетипова структура — це нормально
  });
}

/**
 * Знаходить справжнє ім'я XML-файлу першого аркуша книги (напр. "sheet3.xml"),
 * бо перший аркуш у переліку НЕ завжди фізично називається "sheet1.xml"
 * всередині .xlsx — особливо якщо аркуші додавали/видаляли/переставляли.
 */
function resolveFirstWorksheetPath_(zip) {
  var workbookFile = zip.file('xl/workbook.xml');
  var workbookRelsFile = zip.file('xl/_rels/workbook.xml.rels');
  if (!workbookFile || !workbookRelsFile) return Promise.resolve(null);

  return Promise.all([workbookFile.async('text'), workbookRelsFile.async('text')]).then(function (r) {
    var workbookDoc = new DOMParser().parseFromString(r[0], 'text/xml');
    var relsDoc = new DOMParser().parseFromString(r[1], 'text/xml');

    var firstSheetEl = workbookDoc.getElementsByTagName('sheet')[0];
    if (!firstSheetEl) return null;
    var rId = firstSheetEl.getAttribute('r:id');

    var rel = Array.from(relsDoc.getElementsByTagName('Relationship'))
      .find(function (r) { return r.getAttribute('Id') === rId; });
    if (!rel) return null;

    return rel.getAttribute('Target').split('/').pop(); // напр. "sheet3.xml"
  });
}

function renderAssemblyProductResults_(query) {
  var q = (query || '').trim().toLowerCase();
  var resultsEl = document.getElementById('assemblyProductSearchResults');

  if (CURRENT_COMPONENT_SEARCH_MODE === 'assembly') {
    var pool = STATE_ASSEMBLIES_FOR_PICKER.filter(function (a) { return a.id !== STATE_ASSEMBLY.id; }); // не можна саму себе
    var amatches = (!q ? pool : pool.filter(function (a) {
      return String(a.name || '').toLowerCase().indexOf(q) !== -1 || String(a.article || '').toLowerCase().indexOf(q) !== -1;
    })).slice(0, 40);
    resultsEl.innerHTML = amatches.map(function (a) {
      var photo = a.photoUrl || 'https://via.placeholder.com/60?text=%20';
      return '<div class="product-picker-item" onclick="selectAssemblyProduct_(\'' + a.id + '\')">' +
        '<img src="' + photo + '">' +
        '<div class="ppi-text"><div class="ppi-name">' + (a.article ? escapeHtml(a.article) + ' — ' : '') + escapeHtml(a.name) + ' [готовий виріб]</div>' +
        '<div class="ppi-meta">На складі: ' + (a.availableInStock != null ? a.availableInStock : '?') + ' шт</div></div>' +
        '</div>';
    }).join('') || '<div class="muted" style="padding:10px">Немає інших виробів</div>';
    resultsEl.classList.remove('hidden');
    return;
  }

  var matches = !q ? STATE.products : STATE.products.filter(function (p) {
    return String(p.article || '').toLowerCase().indexOf(q) !== -1 ||
      String(p.name || '').toLowerCase().indexOf(q) !== -1 ||
      String(p.code || '').toLowerCase().indexOf(q) !== -1;
  });
  matches = matches.slice(0, 40);

  resultsEl.innerHTML = matches.map(function (p) {
    var photo = p.photoUrl || 'https://via.placeholder.com/60?text=%20';
    return '<div class="product-picker-item" onclick="selectAssemblyProduct_(\'' + p.id + '\')">' +
      '<img src="' + photo + '">' +
      '<div class="ppi-text"><div class="ppi-name">' + escapeHtml(p.article) + ' — ' + escapeHtml(p.name) + '</div>' +
      '<div class="ppi-meta">' + (p.code ? 'Код: ' + escapeHtml(p.code) + ' · ' : '') + 'Залишок: ' + p.qty + ' ' + escapeHtml(p.unit || '') + '</div></div>' +
      '</div>';
  }).join('') || '<div class="muted" style="padding:10px">Нічого не знайдено</div>';
  resultsEl.classList.remove('hidden');
}

function recomputeCostPreviewLocal() {
  if (STATE.user.role !== 'admin') return;
  var local = 0, german = 0;
  var estimatePromises = [];

  STATE_ASSEMBLY.components.forEach(function (c) {
    if (c.componentType === 'assembly') {
      var sub = STATE_ASSEMBLIES_FOR_PICKER.find(function (a) { return a.id === c.subAssemblyId; });
      if (sub && sub.availableInStock > 0) {
        // Уже реально виготовлявся — беремо фактичну собівартість наявних одиниць.
        local += (sub.avgUnitCostLocal || 0) * c.qty;
        german += (sub.avgUnitCostGerman || 0) * c.qty;
      } else {
        // Ще не виготовлявся — запитуємо оцінку за поточним рецептом (рекурсивно).
        var qty = c.qty;
        estimatePromises.push(
          call('getAssemblyEstimatedCost', STATE.token, c.subAssemblyId).then(function (res) {
            local += (res.local || 0) * qty;
            german += (res.german || 0) * qty;
          }).catch(function () {})
        );
      }
      return;
    }
    var product = STATE.products.find(function (p) { return p.id === c.productId; });
    if (!product) return;
    local += (product.sellPriceEur || 0) * c.qty;
    german += (product.germanPriceExclVat || 0) * c.qty;
  });

  // Власні додаткові витрати ЦЬОГО виробу (праця/пакування/доставка/інше) —
  // враховуємо в оцінці одразу, з полів форми (ще до збереження), тільки в
  // місцеву суму. Німецька собівартість їх свідомо не включає.
  var ownExtraCost = (parseFloat(document.getElementById('assemblyLaborCostField').value) || 0) +
    (parseFloat(document.getElementById('assemblyPackagingCostField').value) || 0) +
    (parseFloat(document.getElementById('assemblyDeliveryCostField').value) || 0) +
    (parseFloat(document.getElementById('assemblyOtherCostField').value) || 0);

  Promise.all(estimatePromises).then(function () {
    showCostPreview(Math.round((local + ownExtraCost) * 100) / 100, Math.round(german * 100) / 100);
  });
}

function showCostPreview(local, german) {
  var el = document.getElementById('assemblyCostPreview');
  if (STATE.user.role !== 'admin') { el.innerHTML = ''; return; }
  el.innerHTML =
    '<div><span>Собівартість (товари за ціною продажу + вироби-компоненти + додаткові витрати):</span>' + local.toFixed(2) + ' €</div>';
}

function checkAssemblyAvailability_() {
  var units = parseFloat(document.getElementById('produceUnitsField').value) || 0;
  var block = document.getElementById('assemblyAvailabilityCheck');
  if (!STATE_ASSEMBLY.id || units <= 0) { block.innerHTML = ''; return; }

  call('checkAssemblyAvailability', STATE.token, STATE_ASSEMBLY.id, units).then(function (res) {
    if (res.enough) {
      block.innerHTML = '<div class="simple-list-item">✅ Всіх компонентів вистачає на ' + units + ' виріб(ів).</div>';

        '<div class="simple-list">' + productShortages.map(function (s) {

        '<button type="button" class="btn btn-secondary btn-small" id="createOrderFromShortageBtn" style="margin-top:8px">🚚 Замовити те, чого бракує</button>';

      html += '<div class="warn-box" style="margin-top:10px">⚠️ Не вистачає готових виробів на складі — їх потрібно спершу виготовити:</div>' +
        '<div class="simple-list">' + subAssemblyShortages.map(function (s) {
          var cleanName = s.name.replace(' (готовий виріб)', '');
          return '<div class="simple-list-item error-text"><span>🛠 ' + escapeHtml(cleanName) + '</span>' +
            '<span>бракує ' + s.shortage + ' <button type="button" class="btn btn-secondary btn-small" onclick="jumpToProduceAssembly_(\'' + s.subAssemblyId + '\')">→ Перейти й виготовити</button></span></div>';
        }).join('') + '</div>';
    }

    block.innerHTML = html;

    if (productShortages.length) {
      document.getElementById('createOrderFromShortageBtn').addEventListener('click', function () {
        STATE_PO_ITEMS = productShortages.map(function (s) {
          return { article: s.article, name: s.name, qty: Math.ceil(s.shortage) };
        });

        document.getElementById('poInvoiceInput').value = '';
        renderPoItemsList_();
        closeModal('assemblyModal');
        navigateTo('purchases');
        document.getElementById('purchaseOrderModal').classList.remove('hidden');

}

/**
 * Показує друковану модалку "Аркуш видачі зі складу" одразу після запуску
 * виробу в роботу — з нею комірник іде на склад і видає всі позиції.
 */
var CURRENT_PICK_LIST_DATA = null;
function showPickList_(res) {
  CURRENT_PICK_LIST_DATA = res;
  document.getElementById('pickListAssemblyName').textContent = res.assemblyName || '';
  document.getElementById('pickListUnits').textContent = res.unitsProduced;
  document.getElementById('pickListDate').textContent = new Date().toLocaleString('uk-UA');

  if (res.serials && res.serials.length) {
    toast('Серійні номери: ' + res.serials.join(', '));
    document.getElementById('pickListSerials').innerHTML = '<strong>Серійні номери:</strong> ' + res.serials.map(escapeHtml).join(', ');
  } else {
    document.getElementById('pickListSerials').innerHTML = '';
  }

  var drawingBlock = document.getElementById('pickListDrawingBlock');
  if (res.drawingFileUrl) {
    // Diskove прев'ю тепер працює однаково і для фото, і для PDF (перша
    // сторінка) — тому завжди вставляємо як зображення, а повний оригінал
    // лишаємо окремим посиланням (важливо для багатосторінкових PDF).
    // Креслення друкується ОКРЕМИМ аркушем А4 (page-break-after) — не
    // "тисне" на таблицю компонентів, яка йде вже з наступної сторінки.
    drawingBlock.innerHTML =
      '<div class="print-page-drawing">' +
      '<img src="' + res.drawingFileUrl + '">' +
      '<div class="drawing-caption">Креслення: ' + escapeHtml(res.drawingFileName || res.assemblyName || '') +
      (res.drawingOriginalUrl ? ' — <a href="' + res.drawingOriginalUrl + '" target="_blank">повний файл (усі сторінки)</a>' : '') +
      '</div></div>';
  } else {
    drawingBlock.innerHTML = '';
  }

  var rows = (res.pickList || []).map(function (item, i) {
    var articleCell = item.consumedSerials
      ? (item.article ? '<strong class="article-strong">' + escapeHtml(item.article) + '</strong>' : '<span class="muted">готовий виріб</span>')
      : '<strong class="article-strong">' + escapeHtml(item.article) + '</strong>';
    var nameCell = escapeHtml(item.name) + (item.consumedSerials && item.consumedSerials.length ? '<br><span class="muted" style="font-size:0.85em">Серійні номери: ' + item.consumedSerials.map(escapeHtml).join(', ') + '</span>' : '');
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + (item.photoUrl ? '<img src="' + item.photoUrl + '" class="ss-print-photo">' : '') + '</td>' +
      '<td contenteditable="true">' + articleCell + '</td>' +
      '<td contenteditable="true">' + escapeHtml(item.code || '') + '</td>' +
      '<td contenteditable="true">' + nameCell + '</td>' +
      '<td contenteditable="true">' + escapeHtml(item.cell || '') + '</td>' +
      '<td contenteditable="true">' + item.qty + '</td>' +
      '<td contenteditable="true">' + escapeHtml(item.unit || '') + '</td>' +
      '<td>☐</td>' +
      '</tr>';
  }).join('');
  document.getElementById('pickListTableBody').innerHTML = rows || '<tr><td colspan="9" class="muted">Немає позицій</td></tr>';

  document.getElementById('pickListModal').classList.remove('hidden');
}

/* ================== ДАНО В РОБОТУ (ЗАМОВЛЕННЯ НА ВИРОБНИЦТВО) ================== */
function loadProductionOrders() {
  var status = document.getElementById('productionStatusFilter').value;
  call('listProductionOrders', STATE.token, status || null).then(function (list) {
    list = list || [];
    var canManage = STATE.user.role === 'admin' || STATE.user.role === 'storekeeper';
    document.getElementById('productionOrdersTableBody').innerHTML = list.map(function (o) {
      var statusLabel = o.status === 'completed' ? '✅ Завершено' : (o.status === 'in_progress' ? '🔨 В роботі' : '🔒 Заплановано (зарезервовано)');
      var stageCell = '—';
      if (o.status === 'planned' && STATE_STAGES.length) {
        var curIdx = o.currentStageIndex != null ? o.currentStageIndex : 0;
        var stageName = STATE_STAGES[curIdx] || STATE_STAGES[STATE_STAGES.length - 1];
        stageCell = '<span class="muted">' + (curIdx + 1) + '/' + STATE_STAGES.length + '</span> ' + escapeHtml(stageName);
        if (canManage && curIdx < STATE_STAGES.length - 1) {
          stageCell += ' <button class="btn btn-secondary btn-small" onclick="advanceStage_(\'' + o.id + '\', ' + (curIdx + 1) + ')">→ Далі</button>';
        }
      }
      var actions = '<button class="btn btn-secondary btn-small" onclick="reprintPickList_(\'' + o.id + '\')">🖨 Друк</button>';
      if (o.status === 'planned' && canManage) {
        actions += ' <button class="btn btn-primary btn-small" onclick="openStartOrderModal_(\'' + o.id + '\', \'' + escapeHtml(o.assemblyName) + '\', ' + o.unitsPlanned + ')">▶ Запустити</button>' +
          ' <button class="btn btn-danger btn-small" onclick="cancelProductionOrder_(\'' + o.id + '\')">✕ Скасувати</button>';
      }
      var costCell = o.totalLocalCostEur != null
        ? (o.totalLocalCostEur.toFixed(2) + ' € / ' + o.totalGermanCostEur.toFixed(2) + ' €' +
           (o.fullCostEur != null ? '<br><span class="muted">повна: ' + o.fullCostEur.toFixed(2) + ' €</span>' : ''))
        : '—';
      return '<tr>' +
        '<td>' + escapeHtml(o.assemblyName) + '</td>' +
        '<td>' + o.unitsPlanned + '</td>' +
        '<td>' + statusLabel + '</td>' +
        '<td>' + stageCell + '</td>' +
        '<td>' + escapeHtml(o.user) + '</td>' +
        '<td>' + o.createdAt + '</td>' +
        '<td>' + (o.completedAt || '—') + '</td>' +
        '<td>' + costCell + '</td>' +
        '<td>' + escapeHtml(o.comment || '') + '</td>' +
        '<td>' + actions + '</td>' +
        '</tr>';
    }).join('') || '<tr><td colspan="9" class="muted">Замовлень ще немає</td></tr>';
  }).catch(function (e) { toast(e.message, true); });
}
(document.getElementById('productionStatusFilter') || {addEventListener:function(){}}).addEventListener('change', loadProductionOrders);

(document.getElementById('confirmStartOrderBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  if (!PENDING_START_ORDER_ID) return;
  function readCost(id) { var v = document.getElementById(id).value; return v === '' ? null : parseFloat(v); }
  var extraCosts = {
    laborCostEur: readCost('startOrderLaborCost'),
    packagingCostEur: readCost('startOrderPackagingCost'),
    deliveryCostEur: readCost('startOrderDeliveryCost'),
    otherCostEur: readCost('startOrderOtherCost')
  };
  var withPercent = STATE_START_ORDER_WORKERS.filter(function (w) { return w.percent != null; });
  var withoutPercent = STATE_START_ORDER_WORKERS.filter(function (w) { return w.percent == null; });
  var usedPercent = withPercent.reduce(function (s, w) { return s + w.percent; }, 0);
  var remaining = Math.max(0, 100 - usedPercent);
  var equalShare = withoutPercent.length ? round2Client_(remaining / withoutPercent.length) : 0;
  var assignedWorkers = STATE_START_ORDER_WORKERS.map(function (w) {
    return { employeeId: w.employeeId, percent: w.percent != null ? w.percent : equalShare };
  });

  withButtonLoading_(this, call('startProductionOrder', STATE.token, PENDING_START_ORDER_ID, extraCosts, assignedWorkers)).then(function (res) {
    closeModal('startOrderModal');
    toast('Запущено в роботу, компоненти списано');
    loadProductionOrders();
    loadProducts();
    showPickList_(res);
  }).catch(function (e) { toast(e.message, true); });
});

function openUserModal(id) {

/* ---------- Точний вимір ширини тексту (canvas) — без вгадування пікселів на символ ---------- */
var SS_MEASURE_CTX_ = null;
var SS_MEASURE_FONT_ = null;
function ssMeasureCtx_() {
  if (!SS_MEASURE_CTX_) {
    SS_MEASURE_CTX_ = document.createElement('canvas').getContext('2d');
  }
  if (!SS_MEASURE_FONT_) {
    // Беремо РЕАЛЬНИЙ шрифт/розмір, яким рендериться таблиця, а не здогадуємось.
    // .ss-table присутній у розмітці одразу (навіть до першого рендеру рядків).
    var probe = document.querySelector('.ss-table');
    var cs = probe ? getComputedStyle(probe) : null;
    SS_MEASURE_FONT_ = cs ? (cs.fontSize + ' ' + cs.fontFamily) : '18px -apple-system, Arial, sans-serif';
    SS_MEASURE_CTX_.font = SS_MEASURE_FONT_;
  }
  return SS_MEASURE_CTX_;
}
function measureTextWidth_(text, bold) {
  var ctx = ssMeasureCtx_();
  ctx.font = bold ? ('800 ' + SS_MEASURE_FONT_) : SS_MEASURE_FONT_;
  return ctx.measureText(String(text || '')).width;
}
function longestWordWidth_(text, bold) {
  var words = String(text || '').split(/\s+/);
  var max = 0;
  words.forEach(function (w) {
    var wpx = measureTextWidth_(w, bold);
    if (wpx > max) max = wpx;
  });
  return max;
}
function simulateWrapRowsByWidth_(text, availableWidthPx, bold) {
  var words = String(text || '').split(/\s+/).filter(Boolean);
  if (!words.length) return 1;
  var spaceWidth = measureTextWidth_(' ', bold);
  var rows = 1, lineWidth = 0;
  words.forEach(function (w) {
    var wpx = measureTextWidth_(w, bold);
    var addWidth = lineWidth === 0 ? wpx : lineWidth + spaceWidth + wpx;
    if (addWidth > availableWidthPx && lineWidth > 0) {
      rows++;
      lineWidth = wpx;
    } else {
      lineWidth = addWidth;
    }
  });
  return rows;
}

function renderSpreadsheetGrid_() {
  var head = document.getElementById('ssTableHead');
  var body = document.getElementById('ssTableBody');

  var gridColumns = SS_COLUMNS.filter(function (c) { return c.type !== 'photo' && STATE_SS.visibleColumns[c.key]; });

  // Ширина колонки — з розрахунку на НАЙДОВШЕ ОКРЕМЕ СЛОВО (не всю довжину тексту) —
  // саме тому одне слово чи число (наприклад, артикул) ніколи не розбивається
  // посеред символів: колонка завжди достатньо широка для нього цілого.
  var MIN_W = 70, MAX_W = 260, PADDING = 26; // PADDING — під горизонтальні відступи textarea (padding: 8px 10px з обох боків + запас)
  var colWidths = {};
  gridColumns.forEach(function (c) {
    var isBold = c.key === 'article';
    // Заголовок НЕ переноситься (nowrap) і завжди жирний — тому колонці треба
    // вмістити ЦІЛИЙ жирний напис одним рядком, а не лише найдовше слово з нього.
    var maxWordPx = measureTextWidth_(c.label, true);
    STATE_SS.products.forEach(function (p) {
      var wpx = longestWordWidth_(String(p[c.key] == null ? '' : p[c.key]), isBold);
      if (wpx > maxWordPx) maxWordPx = wpx;
    });
    colWidths[c.key] = Math.max(MIN_W, Math.min(MAX_W, Math.ceil(maxWordPx + PADDING)));
  });

  var totalWidth = (STATE_SS.selectMode ? 36 : 0) + 44 + 60 + gridColumns.reduce(function (sum, c) { return sum + colWidths[c.key]; }, 0);
  document.querySelector('.ss-table').style.width = totalWidth + 'px';

  var headCells = (STATE_SS.selectMode ? '<th style="width:36px"></th>' : '') + '<th style="width:44px">№</th><th style="width:60px">Фото</th>' +
    gridColumns.map(function (c) { return '<th style="width:' + colWidths[c.key] + 'px">' + c.label + '</th>'; }).join('');
  head.innerHTML = '<tr>' + headCells + '</tr>';

  body.innerHTML = STATE_SS.products.map(function (p, rowNum) {
    var checkCell = STATE_SS.selectMode
      ? '<td><input type="checkbox" class="ss-row-checkbox" onchange="toggleSsRowSelect_(\'' + p.id + '\', this.checked)"' + (STATE_SS.selected[p.id] ? ' checked' : '') + '></td>'
      : '';
    var numCell = '<td class="ss-table-row-num">' + (rowNum + 1) + '</td>';
    var photoCell = '<td><img class="ss-photo-cell" src="' + (p.photoUrl || 'https://via.placeholder.com/60?text=%20') + '" onclick="ssTriggerPhotoUpload_(\'' + p.id + '\')"></td>';

    var cells = gridColumns.map(function (c) {
      var val = p[c.key];
      val = (val == null) ? '' : val;
      var common = ' data-product-id="' + p.id + '" data-field="' + c.key + '" data-special="' + (c.special || '') + '"';

      if (c.type === 'number') {
        return '<td style="width:' + colWidths[c.key] + 'px"><input type="number" step="any" value="' +
          String(val).replace(/"/g, '&quot;') + '"' + common + (c.key === 'article' ? ' class="ss-article-input"' : '') + ' onchange="ssCellChanged_(this)"></td>';
      }
      // Текстові поля — textarea з наперед розрахованою кількістю рядків за
      // ТОЧНИМ виміром ширини тексту (canvas), а не приблизною оцінкою "N пікселів
      // на символ" — саме та оцінка й давала обрубування слів раніше.
      var taClass = 'ss-cell-textarea' + (c.key === 'article' ? ' ss-article-input' : '') + (c.readOnly ? ' ss-readonly-cell' : '');
      var rowsNeeded = simulateWrapRowsByWidth_(String(val), colWidths[c.key] - PADDING, c.key === 'article');
      // readOnly-колонки (напр. "Використовується у виробах") обчислюються
      // сервером на льоту, не зберігаються в картці товару — тому НЕ дають
      // редагувати (readonly, без onchange), щоб не створювати ілюзію, що
      // тут можна щось змінити.
      return '<td style="width:' + colWidths[c.key] + 'px"><textarea rows="' + rowsNeeded + '" class="' + taClass + '"' + common +
        (c.readOnly ? ' readonly tabindex="-1"' : ' onchange="ssCellChanged_(this)"') + ' oninput="ssAutoGrow_(this)">' + escapeHtml(val) + '</textarea></td>';
    }).join('');

    return '<tr>' + checkCell + numCell + photoCell + cells + '</tr>';
  }).join('');

  // Одразу підганяємо висоту кожного textarea під вже наявний текст (не тільки при друку).
  document.querySelectorAll('.ss-cell-textarea').forEach(function (el) { ssAutoGrow_(el); });
}

function ssAutoGrow_(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function ssCellChanged_(inputEl) {
  var productId = inputEl.dataset.productId;
  var field = inputEl.dataset.field;
  var special = inputEl.dataset.special;
  var value = inputEl.value;
  var col = SS_COLUMNS.find(function (c) { return c.key === field; });
  if (col && col.type === 'number') value = parseFloat(value) || 0;

  var markSaved = function () {
    inputEl.classList.add('ss-saved');
    setTimeout(function () { inputEl.classList.remove('ss-saved'); }, 1200);
  };

  if (special === 'qty') {
    // Кількість завжди йде через коригування (не напряму) — щоб зміна
    // так само лишалась в історії операцій, як і будь-яка інша зміна залишку.
    call('adjustStock', STATE.token, productId, value, 'Змінено через таблицю товарів').then(function () {
      markSaved();
      var p = STATE_SS.products.find(function (x) { return x.id === productId; });
      if (p) p.qty = value;
    }).catch(function (e) { toast(e.message, true); });
    return;
  }

  var payload = {};
  payload[field] = value;
  call('updateProduct', STATE.token, productId, payload).then(function () {
    markSaved();
    var p = STATE_SS.products.find(function (x) { return x.id === productId; });
    if (p) p[field] = value;
  }).catch(function (e) { toast(e.message, true); });
}

var SS_PHOTO_TARGET_ID = null;
function ssTriggerPhotoUpload_(productId) {
  SS_PHOTO_TARGET_ID = productId;
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1];
      call('uploadProductPhoto', STATE.token, SS_PHOTO_TARGET_ID, base64, file.type, file.name).then(function (res) {
        var p = STATE_SS.products.find(function (x) { return x.id === SS_PHOTO_TARGET_ID; });
        if (p) p.photoUrl = res.url;
        renderSpreadsheetGrid_();
        toast('Фото оновлено');
      }).catch(function (err) { toast(err.message, true); });
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

(document.getElementById('ssExportExcelBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var sel = ssGetExportSelection_();
  if (!sel.rows.length) return toast('Немає жодного товару для експорту', true);
  if (!sel.cols.length) return toast('Оберіть хоча б одну колонку', true);

  withButtonLoading_(this, loadXlsxLib_()).then(function () {
    var header = sel.cols.map(function (c) { return c.type === 'photo' ? 'Фото (посилання)' : c.label; });
    var data = sel.rows.map(function (p) {
      return sel.cols.map(function (c) {
        if (c.key === 'photoUrl') return p.photoUrl || '';
        return p[c.key] != null ? p[c.key] : '';
      });
    });
    var ws = XLSX.utils.aoa_to_sheet([header].concat(data));

    // Excel-бібліотека, яку ми використовуємо (безкоштовна SheetJS), не вміє
    // вставляти самі картинки у файл — це можливо лише в платній версії.
    // Тому фото додаємо як РОБОЧЕ клікабельне посилання на нього — відкривається
    // одним кліком прямо з Excel/Google Таблиць.
    var photoColIdx = sel.cols.findIndex(function (c) { return c.key === 'photoUrl'; });
    if (photoColIdx !== -1) {
      sel.rows.forEach(function (p, rowIdx) {
        if (!p.photoUrl) return;
        var cellRef = XLSX.utils.encode_cell({ r: rowIdx + 1, c: photoColIdx });
        ws[cellRef] = { t: 's', v: 'Відкрити фото', l: { Target: p.photoUrl, Tooltip: p.photoUrl } };
      });
    }

    // Автоматична ширина колонок за найдовшим вмістом (заголовок або значення) —
    // щоб не доводилось потім вручну розтягувати кожну колонку.
    ws['!cols'] = sel.cols.map(function (c, i) {
      var maxLen = header[i].length;
      data.forEach(function (row) {
        var len = String(row[i] == null ? '' : row[i]).length;
        if (len > maxLen) maxLen = len;
      });
      return { wch: Math.min(Math.max(maxLen + 2, 10), 45) };
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Товари');
    XLSX.writeFile(wb, 'SHSklad_tablytsia_' + new Date().toISOString().slice(0, 10) + '.xlsx');
    closeModal('ssExportModal');
  }).catch(function (e) { toast(e.message, true); });
});

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/**
 * Перевірка при старті: якщо якогось HTML-файлу бракує в проєкті (наприклад,
 * забули додати production.html після оновлення) — раніше це "тихо" ламало
 * реєстрацію ВСІХ наступних кнопок без жодного пояснення. Тепер показує
 * чіткий список, чого саме бракує.
 */
(function checkRequiredElements_() {
  var required = [
    'exportBtn', 'importBtn', 'bulkReceiveBtn', 'addProductBtn',
    'productionStatusFilter', 'assemblyModal', 'refreshPageBtn'
  ];
  var missing = required.filter(function (id) { return !document.getElementById(id); });
  if (missing.length) {
    console.error('SHSklad: відсутні елементи інтерфейсу (можливо, не завантажено якийсь HTML-файл):', missing);
    var el = document.getElementById('toast');
    if (el) {
      el.textContent = 'Увага: не всі файли застосунку завантажено (відсутні: ' + missing.join(', ') + '). Перевірте, чи всі файли скопійовано в проєкт.';
      el.className = 'toast error';
      el.style.display = 'block';
    }
  }
})();

function renderSupplierRequestsPreview_() {
  var isAdmin = STATE.user.role === 'admin';
  if (STATE_SUPPLIER_PREVIEW_ACTIVE_TAB >= STATE_SUPPLIER_PREVIEW.length) STATE_SUPPLIER_PREVIEW_ACTIVE_TAB = 0;

  var grandTotal = round2Client_(STATE_SUPPLIER_PREVIEW.reduce(function (sum, group) { return sum + supplierPreviewGroupTotal_(group); }, 0));
  var totalBanner = isAdmin
    ? '<div class="supplier-grand-total">Загальна сума по всіх заявках: <strong>' + grandTotal.toFixed(2) + ' €</strong></div>'
    : '';

  var tabsHtml = '<div class="supplier-tabs-row">' + STATE_SUPPLIER_PREVIEW.map(function (group, gi) {
    var isActive = gi === STATE_SUPPLIER_PREVIEW_ACTIVE_TAB;
    var subLabel = isAdmin ? '<span class="supplier-tab-sub">' + supplierPreviewGroupTotal_(group).toFixed(2) + ' €</span>' : '';
    return '<button type="button" class="supplier-tab-btn' + (isActive ? ' active' : '') + '" onclick="switchSupplierPreviewTab_(' + gi + ')">' +
      '📋 ' + escapeHtml(group.supplierName) + subLabel + '</button>';
  }).join('') + '</div>';

  var activeGroup = STATE_SUPPLIER_PREVIEW[STATE_SUPPLIER_PREVIEW_ACTIVE_TAB];
  var panelHtml = '';
  if (activeGroup) {
    var supplierTotal = supplierPreviewGroupTotal_(activeGroup);
    var gi = STATE_SUPPLIER_PREVIEW_ACTIVE_TAB;
    var rows = activeGroup.items.map(function (it, ii) {
      var photo = it.photoUrl || 'https://via.placeholder.com/50?text=%20';
      var lineTotal = round2Client_((it.expectedPrice || 0) * it.qty);
      var priceHtml = isAdmin
        ? ' <span class="muted">· ' + (it.expectedPrice || 0).toFixed(2) + ' €/од. = ' + lineTotal.toFixed(2) + ' €</span>'
        : '';
      return '<div class="component-row">' +
        '<img src="' + photo + '" style="width:36px;height:36px;object-fit:cover;border-radius:6px;margin-right:8px">' +
        '<span class="comp-name">' + (it.article ? escapeHtml(it.article) + ' — ' : '') + escapeHtml(it.name) +
        ' <span class="muted">(потрібно: ' + it.qty + ', на складі зараз: ' + (it.currentStock != null ? it.currentStock : '?') + ')</span>' + priceHtml + '</span>' +
        '<input class="comp-qty" type="number" step="any" value="' + it.qty + '" title="Кількість для замовлення — скоригуйте за потреби" onchange="supplierPreviewQtyChanged_(' + gi + ',' + ii + ', this.value)">' +
        '<button type="button" onclick="removeSupplierPreviewItem_(' + gi + ',' + ii + ')">×</button>' +
        '</div>';
    }).join('');

    var subtotalHtml = isAdmin
      ? '<div class="supplier-subtotal">Разом по постачальнику: <strong>' + supplierTotal.toFixed(2) + ' €</strong></div>'
      : '';
    panelHtml = '<div class="panel supplier-request-panel">' + (rows || '<div class="muted">Порожньо</div>') + subtotalHtml + '</div>';
  }

  document.getElementById('supplierRequestsGroups').innerHTML = totalBanner + tabsHtml + panelHtml;
}
function supplierPreviewQtyChanged_(gi, ii, value) {
  STATE_SUPPLIER_PREVIEW[gi].items[ii].qty = parseFloat(value) || 0;
  renderSupplierRequestsPreview_();
}
function removeSupplierPreviewItem_(gi, ii) {
  STATE_SUPPLIER_PREVIEW[gi].items.splice(ii, 1);
  renderSupplierRequestsPreview_();
}

function debounce_(fn, ms) {
  var t;
  return function () {
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(null, args); }, ms);
  };
}

function openInventorySessionView_(sessionId) {
  CURRENT_INV_SESSION_ID = sessionId;
  call('getInventorySession', STATE.token, sessionId).then(function (s) {
    CURRENT_INV_ITEMS = s.items || [];

      (s.completedAt ? ' · Завершено: ' + s.completedAt : '');
    document.getElementById('invItemsSearch').value = '';

    document.getElementById('invCompleteBlock').classList.toggle('hidden', !canEdit);
    document.getElementById('invCompleteResult').innerHTML = '';

function renderInvItems_(items) {
  var canEdit = document.getElementById('invCompleteBlock') && !document.getElementById('invCompleteBlock').classList.contains('hidden');
  document.getElementById('invItemsBody').innerHTML = items.map(function (it) {
    var diffCell = it.counted
      ? '<span' + (it.difference !== 0 ? ' class="error-text"' : '') + '>' + (it.difference > 0 ? '+' : '') + it.difference + '</span>'
      : '<span class="muted">—</span>';
    var actualCell = canEdit
      ? '<input type="number" step="any" value="' + (it.counted ? it.actualQty : '') + '" style="max-width:100px" onchange="setInvActual_(\'' + it.id + '\', this.value)">'
      : (it.counted ? it.actualQty : '<span class="muted">не пораховано</span>');
    return '<tr><td><strong class="article-strong">' + escapeHtml(it.article) + '</strong></td><td>' + escapeHtml(it.productName) +
      '</td><td>' + it.expectedQty + '</td><td>' + actualCell + '</td><td>' + diffCell + '</td></tr>';
  }).join('') || '<tr><td colspan="5" class="muted">Немає позицій</td></tr>';
}

(document.getElementById('invItemsSearch') || {addEventListener:function(){}}).addEventListener('input', function () {
  var q = this.value.trim().toLowerCase();
  var filtered = !q ? CURRENT_INV_ITEMS : CURRENT_INV_ITEMS.filter(function (it) {
    return String(it.article || '').toLowerCase().indexOf(q) !== -1 || String(it.productName || '').toLowerCase().indexOf(q) !== -1;
  });
  renderInvItems_(filtered);
});

function setInvActual_(itemId, value) {
  if (value === '') return;
  call('setInventoryItemActual', STATE.token, itemId, parseFloat(value) || 0).then(function () {
    var item = CURRENT_INV_ITEMS.find(function (it) { return it.id === itemId; });
    if (item) { item.actualQty = parseFloat(value) || 0; item.counted = true; item.difference = round2Client_(item.actualQty - item.expectedQty); }
  }).catch(function (e) { toast(e.message, true); });
}
function round2Client_(n) { return Math.round(n * 100) / 100; }

function openQcModal_(finishedGoodId, serial) {
  CURRENT_QC_FG_ID = finishedGoodId;

  document.getElementById('qcPhotoInput').value = '';

  call('listQCChecklist', STATE.token).then(function (list) {

(document.getElementById('qcPhotoInput') || {addEventListener:function(){}}).addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { STATE_QC_PHOTO = { base64: reader.result.split(',')[1], mime: file.type }; };
  reader.readAsDataURL(file);
});

function submitQc_(result) {
  var checklistResults = Array.from(document.querySelectorAll('.qc-check-item')).map(function (cb) {
    return { item: cb.value, passed: cb.checked };
  });
  var comment = document.getElementById('qcCommentInput').value.trim();
  var args = [STATE.token, CURRENT_QC_FG_ID, checklistResults, result, comment];
  if (STATE_QC_PHOTO) { args.push(STATE_QC_PHOTO.base64, STATE_QC_PHOTO.mime); }

  call.apply(null, ['performQualityCheck'].concat(args)).then(function () {
    toast(result === 'accepted' ? 'Прийнято ✅' : 'Повернуто на доопрацювання');
    closeModal('qcModal');
    closeModal('finishedGoodViewModal');
    loadFinishedGoods();
  }).catch(function (e) { toast(e.message, true); });
}
(document.getElementById('qcAcceptBtn') || {addEventListener:function(){}}).addEventListener('click', function () { submitQc_('accepted'); });

  var status = document.getElementById('shipmentStatusFilter').value;
  call('listShipments', STATE.token, status || null).then(function (list) {
    list = list || [];
    document.getElementById('shipmentsGrid').innerHTML = list.map(function (s) {
      return '<div class="product-card" onclick="openShipmentView_(\'' + s.id + '\')">' +
        '<div class="name">' + escapeHtml(s.carrier || '(без перевізника)') + (s.waybillNumber ? ' — № ' + escapeHtml(s.waybillNumber) : '') + '</div>' +
        '<div class="meta">' + s.itemCount + ' виріб(ів) · ' + (s.packageCount || 0) + ' місць</div>' +
        '<div class="qty-badge">' + (SH_STATUS_LABELS_[s.status] || s.status) + '</div>' +
        (s.shipDate ? '<div class="meta">Відправлено: ' + s.shipDate + '</div>' : '') +
        '</div>';
    }).join('') || '<div class="muted">Відвантажень ще немає</div>';
  }).catch(function (e) { toast(e.message, true); });
}
(document.getElementById('shipmentStatusFilter') || {addEventListener:function(){}}).addEventListener('change', loadShipments);

(document.getElementById('addShipmentBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  STATE_SH_SERIALS = [];
  STATE_SH_PHOTO = null;
  ['shCarrierInput', 'shWaybillInput', 'shPackageCountInput', 'shWeightInput', 'shDimensionsInput', 'shShipDateInput', 'shCommentInput'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('shPhotoInput').value = '';
  document.getElementById('shSerialInput').value = '';
  renderShSerialsList_();
  document.getElementById('shipmentModal').classList.remove('hidden');
});

(document.getElementById('shPhotoInput') || {addEventListener:function(){}}).addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () { STATE_SH_PHOTO = { base64: reader.result.split(',')[1], mime: file.type }; toast('Фото додано'); };
  reader.readAsDataURL(file);
});

(document.getElementById('addShSerialBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var serial = document.getElementById('shSerialInput').value.trim();
  if (!serial) return toast('Вкажіть серійний номер', true);
  if (STATE_SH_SERIALS.indexOf(serial) !== -1) return toast('Уже додано', true);
  STATE_SH_SERIALS.push(serial);
  document.getElementById('shSerialInput').value = '';
  renderShSerialsList_();
});
function renderShSerialsList_() {
  document.getElementById('shSerialsList').innerHTML = STATE_SH_SERIALS.length
    ? STATE_SH_SERIALS.map(function (sn, i) {
        return '<div class="component-row"><span class="comp-name article-strong">' + escapeHtml(sn) + '</span><button type="button" onclick="removeShSerial_(' + i + ')">×</button></div>';
      }).join('')
    : '<div class="muted">Серійних номерів ще не додано.</div>';
}
function removeShSerial_(i) { STATE_SH_SERIALS.splice(i, 1); renderShSerialsList_(); }

(document.getElementById('saveShipmentBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  if (!STATE_SH_SERIALS.length) return toast('Додайте хоча б один серійний номер', true);
  var payload = {
    carrier: document.getElementById('shCarrierInput').value.trim(),
    waybillNumber: document.getElementById('shWaybillInput').value.trim(),
    packageCount: parseFloat(document.getElementById('shPackageCountInput').value) || 0,
    weight: parseFloat(document.getElementById('shWeightInput').value) || 0,
    dimensions: document.getElementById('shDimensionsInput').value.trim(),
    shipDate: document.getElementById('shShipDateInput').value,

    serialNumbers: STATE_SH_SERIALS

  withButtonLoading_(this, call('createShipment', STATE.token, payload)).then(function () {
    toast('Відвантаження створено');
    closeModal('shipmentModal');
    loadShipments();

function openShipmentView_(id) {
  CURRENT_SHIPMENT_ID = id;
  call('getShipment', STATE.token, id).then(function (s) {
    document.getElementById('shViewTitle').textContent = (s.carrier || '(без перевізника)') + (s.waybillNumber ? ' — № ' + s.waybillNumber : '');
    var itemsHtml = (s.items || []).map(function (it) {
      return '<div class="simple-list-item"><span class="article-strong">' + escapeHtml(it.serialNumber) + '</span></div>';
    }).join('') || '<div class="muted">Немає позицій</div>';

    document.getElementById('shViewBody').innerHTML =
      '<div class="muted">Статус: ' + (SH_STATUS_LABELS_[s.status] || s.status) + '</div>' +
      '<div class="muted">Місць: ' + (s.packageCount || 0) + ' · Вага: ' + (s.weight || 0) + ' кг · Габарити: ' + escapeHtml(s.dimensions || '—') + '</div>' +
      '<div class="muted">Відправлено: ' + (s.shipDate || '—') + (s.deliveryDate ? ' · Доставлено: ' + s.deliveryDate : '') + '</div>' +
      (s.photoUrl ? '<img src="' + s.photoUrl + '" style="max-width:100%;border-radius:8px;margin-top:8px">' : '') +
      '<h3 style="margin-top:14px">Вироби у відвантаженні</h3>' + itemsHtml;

    var canManage = STATE.user.role === 'admin' || STATE.user.role === 'storekeeper';
    document.getElementById('shMarkDeliveredBtn').classList.toggle('hidden', !canManage || s.status === 'delivered');
    document.getElementById('shDeleteBtn').classList.toggle('hidden', !canManage);
    document.getElementById('shipmentViewModal').classList.remove('hidden');
  }).catch(function (e) { toast(e.message, true); });
}

(document.getElementById('shDeleteBtn') || {addEventListener:function(){}}).addEventListener('click', function () {

var STATE_EMPLOYEES_ACTIVE = []; // для випадаючого списку призначення

function loadEmployees() {
  call('listEmployees', STATE.token, true).then(function (list) {
    list = list || [];
    STATE_EMPLOYEES_ACTIVE = list.filter(function (e) { return e.status === 'active'; });
    document.getElementById('employeesGrid').innerHTML = list.map(function (e) {
      return '<div class="product-card" onclick="openEmployeeModal_(\'' + e.id + '\')">' +
        (e.photoUrl ? '<img src="' + e.photoUrl + '" loading="lazy">' : '') +
        '<div class="name">' + escapeHtml(e.fullName) + (e.status === 'inactive' ? ' <span class="muted">(неактивний)</span>' : '') + '</div>' +
        '<div class="meta">' + escapeHtml(e.position || '') + '</div>' +
        '</div>';
    }).join('') || '<div class="muted">Працівників ще немає</div>';
  }).catch(function (e) { toast(e.message, true); });
}

(document.getElementById('addEmployeeBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  openEmployeeModal_(null);
});

function openEmployeeModal_(id) {
  document.getElementById('employeeIdField').value = id || '';
  document.getElementById('employeeModalTitle').textContent = id ? 'Картка працівника' : 'Новий працівник';
  document.getElementById('deleteEmployeeBtn').style.display = id ? '' : 'none';
  document.getElementById('employeePhotoPreview').src = 'https://via.placeholder.com/300x200?text=Немає+фото';

  if (!id) {
    ['employeeNameField', 'employeePositionField', 'employeePhoneField', 'employeeHireDateField', 'employeeNotesField'].forEach(function (fid) {
      document.getElementById(fid).value = '';
    });
    document.getElementById('employeeStatusField').value = 'active';
    document.getElementById('employeeModal').classList.remove('hidden');
    return;
  }

  call('listEmployees', STATE.token, true).then(function (list) {
    var emp = (list || []).find(function (e) { return e.id === id; });
    if (!emp) return toast('Працівника не знайдено', true);
    document.getElementById('employeeNameField').value = emp.fullName;
    document.getElementById('employeePositionField').value = emp.position || '';
    document.getElementById('employeePhoneField').value = emp.phone || '';
    document.getElementById('employeeHireDateField').value = (emp.hireDate || '').slice(0, 10);
    document.getElementById('employeeStatusField').value = emp.status || 'active';
    document.getElementById('employeeNotesField').value = emp.notes || '';
    document.getElementById('employeePhotoPreview').src = emp.photoUrl || 'https://via.placeholder.com/300x200?text=Немає+фото';
    document.getElementById('employeeModal').classList.remove('hidden');
  }).catch(function (e) { toast(e.message, true); });
}

(document.getElementById('employeePhotoInput') || {addEventListener:function(){}}).addEventListener('change', function (e) {
  var file = e.target.files[0];
  var id = document.getElementById('employeeIdField').value;
  if (!file || !id) { if (!id) toast('Спершу збережіть працівника', true); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = reader.result.split(',')[1];
    call('uploadEmployeePhoto', STATE.token, id, base64, file.type, file.name).then(function (res) {
      document.getElementById('employeePhotoPreview').src = res.url;
      toast('Фото оновлено');
    }).catch(function (err) { toast(err.message, true); });
  };
  reader.readAsDataURL(file);
});

(document.getElementById('saveEmployeeBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var id = document.getElementById('employeeIdField').value;
  var payload = {
    fullName: document.getElementById('employeeNameField').value.trim(),
    position: document.getElementById('employeePositionField').value.trim(),
    phone: document.getElementById('employeePhoneField').value.trim(),

    closeModal('employeeModal');

(document.getElementById('deleteEmployeeBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var id = document.getElementById('employeeIdField').value;

function loadPayrollSummary_() {

    call('listEmployees', STATE.token, true).then(function (list) { STATE_EMPLOYEES_ACTIVE = (list || []).filter(function (e) { return e.status === 'active'; }); });
  }
  var from = document.getElementById('payrollFromDate').value;
  var to = document.getElementById('payrollToDate').value;
  call('getPayrollSummaryReport', STATE.token, from || null, to || null).then(function (list) {
    list = list || [];
    document.getElementById('payrollSummaryBody').innerHTML = list.map(function (r) {
      return '<tr>' +
        '<td>' + escapeHtml(r.fullName) + '</td><td>' + r.units + '</td><td>' + r.earned.toFixed(2) + ' €</td>' +
        '<td>' + r.bonuses.toFixed(2) + ' €</td><td>' + r.penalties.toFixed(2) + ' €</td><td>' + r.advances.toFixed(2) + ' €</td>' +
        '<td><strong>' + r.total.toFixed(2) + ' €</strong></td><td>' + (r.defects || 0) + '</td>' +
        '<td><button class="btn btn-secondary btn-small" onclick="openEmployeePayroll_(\'' + r.employeeId + '\', \'' + escapeHtml(r.fullName).replace(/'/g, "\\'") + '\')">Журнал</button></td>' +

/* ---------- Призначення працівників при запуску виробництва ---------- */
var STATE_START_ORDER_WORKERS = []; // [{employeeId, name, percent}]

(document.getElementById('addStartOrderWorkerBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var select = document.getElementById('startOrderWorkerSelect');
  var employeeId = select.value;
  if (!employeeId) return toast('Оберіть працівника', true);
  if (STATE_START_ORDER_WORKERS.find(function (w) { return w.employeeId === employeeId; })) return toast('Уже додано', true);

  var percentInput = parseFloat(document.getElementById('startOrderWorkerPercent').value);
  var emp = STATE_EMPLOYEES_ACTIVE.find(function (e) { return e.id === employeeId; });
  STATE_START_ORDER_WORKERS.push({ employeeId: employeeId, name: emp ? emp.fullName : '', percent: percentInput || null });
  document.getElementById('startOrderWorkerPercent').value = '';
  renderStartOrderWorkers_();
});

function renderStartOrderWorkers_() {
  // Якщо частина без явного відсотка — ділимо порівну між тими, хто без відсотка,
  // з рештою від тих, хто вже має свій.
  var withPercent = STATE_START_ORDER_WORKERS.filter(function (w) { return w.percent != null; });
  var withoutPercent = STATE_START_ORDER_WORKERS.filter(function (w) { return w.percent == null; });
  var usedPercent = withPercent.reduce(function (s, w) { return s + w.percent; }, 0);
  var remaining = Math.max(0, 100 - usedPercent);
  var equalShare = withoutPercent.length ? round2Client_(remaining / withoutPercent.length) : 0;

  document.getElementById('startOrderWorkersList').innerHTML = STATE_START_ORDER_WORKERS.map(function (w, i) {
    var effective = w.percent != null ? w.percent : equalShare;
    return '<div class="component-row"><span class="comp-name">' + escapeHtml(w.name) + ' — ' + effective + '%' + (w.percent == null ? ' (порівну)' : '') + '</span>' +
      '<button type="button" onclick="removeStartOrderWorker_(' + i + ')">×</button></div>';
  }).join('') || '<div class="muted">Працівників ще не додано.</div>';
}
function removeStartOrderWorker_(i) { STATE_START_ORDER_WORKERS.splice(i, 1); renderStartOrderWorkers_(); }

/* ================== TELEGRAM-БОТ ================== */
function loadTelegramStatus_() {
  if (!document.getElementById('telegramPanel') || STATE.user.role !== 'admin') return;
  call('getTelegramStatus', STATE.token).then(function (res) {
    var lines = [];
    lines.push(res.configured ? '✅ Токен збережено' + (res.botUsername ? ' (' + res.botUsername + ')' : '') : '⚠️ Токен ще не додано');
    lines.push(res.pollingActive ? '✅ Опитування увімкнено (перевірка щохвилини)' : '⚠️ Опитування вимкнено');
    lines.push('Останнє опитування: ' + (res.lastPollAt || '— ще не запускалось'));
    if (res.lastError) lines.push('<span style="color:var(--danger)">Остання помилка від Telegram: ' + escapeHtml(res.lastError) + '</span>');
    lines.push('Прив\'язано користувачів: ' + res.linkedUsers.length);
    document.getElementById('telegramStatusLine').innerHTML = lines.join('<br>');

    var listEl = document.getElementById('telegramLinkedUsersList');
    if (!res.linkedUsers.length) { listEl.innerHTML = ''; return; }
    listEl.innerHTML = '<table class="data-table"><thead><tr><th>Логін</th><th>Роль</th><th>ПІБ</th><th>Прив\'язано</th><th></th></tr></thead><tbody>' +
      res.linkedUsers.map(function (u) {
        return '<tr><td>' + escapeHtml(u.login) + '</td><td>' + escapeHtml(u.role) + '</td><td>' + escapeHtml(u.fullName || '') + '</td><td>' + escapeHtml(u.linkedAt || '') + '</td>' +
          '<td><button class="btn btn-danger btn-small" data-tg-chat="' + escapeHtml(u.chatId) + '">Відв\'язати</button></td></tr>';
      }).join('') + '</tbody></table>';
    listEl.querySelectorAll('[data-tg-chat]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        call('unlinkTelegramUser', STATE.token, btn.getAttribute('data-tg-chat')).then(function () {
          toast('Відв\'язано'); loadTelegramStatus_();
        }).catch(function (e) { toast(e.message, true); });
      });
    });
  }).catch(function () {});
}
