/* ---------- Розпізнавання накладної ---------- */
var STATE_INVOICE_REVIEW = [];
(document.getElementById('aiRecognizeInvoiceBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var file = document.getElementById('poInvoiceInput').files[0];
  if (!file) return toast('Спершу завантажте фото чи скан накладної', true);
  var statusEl = document.getElementById('aiRecognizeStatus');
  statusEl.innerHTML = '<div class="muted">🤖 Gemini аналізує накладну, це може зайняти кілька секунд...</div>';

  var reader = new FileReader();
  reader.onload = function () {
    var base64 = reader.result.split(',')[1];
    call('recognizeInvoiceWithAI', STATE.token, base64, file.type).then(function (items) {
      statusEl.innerHTML = '';
      STATE_INVOICE_REVIEW = items.map(function (it) {
        return { rawName: it.rawName, article: it.article || '', name: it.matchedName || it.rawName, qty: it.qty, matched: it.matched, include: true };
      });
      renderInvoiceReview_();
      document.getElementById('invoiceReviewModal').classList.remove('hidden');
    }).catch(function (e) { statusEl.innerHTML = ''; toast(e.message, true); });
  };
  reader.readAsDataURL(file);
});

function renderInvoiceReview_() {
  document.getElementById('invoiceReviewRows').innerHTML = STATE_INVOICE_REVIEW.map(function (row, i) {
    var statusBadge = row.matched
      ? '<span class="muted">✅ знайдено</span>'
      : '<span class="warn-box" style="display:inline-block;padding:2px 8px;margin:0">⚠️ не знайдено — перевірте вручну</span>';
    var addProductBtn = row.matched ? '' :
      '<button type="button" class="btn btn-secondary btn-small" onclick="quickAddProductFromInvoice_(' + i + ')">+ Додати як новий товар</button>';
    return '<div class="component-row" style="flex-wrap:wrap">' +
      '<input type="checkbox" ' + (row.include ? 'checked' : '') + ' onchange="STATE_INVOICE_REVIEW[' + i + '].include=this.checked">' +
      '<span class="muted" style="min-width:140px">Розпізнано: «' + escapeHtml(row.rawName) + '»</span>' +
      '<input type="text" placeholder="Артикул" value="' + escapeHtml(row.article) + '" style="max-width:110px" onchange="STATE_INVOICE_REVIEW[' + i + '].article=this.value">' +
      '<input type="text" placeholder="Назва" value="' + escapeHtml(row.name) + '" onchange="STATE_INVOICE_REVIEW[' + i + '].name=this.value">' +
      '<input type="number" step="any" value="' + row.qty + '" style="max-width:80px" onchange="STATE_INVOICE_REVIEW[' + i + '].qty=parseFloat(this.value)||0">' +
      statusBadge + addProductBtn +
      '</div>';
  }).join('') || '<div class="muted">Нічого не розпізнано</div>';
}

function quickAddProductFromInvoice_(i) {
  var row = STATE_INVOICE_REVIEW[i];
  var article = row.article.trim() || ('NEW-' + Date.now().toString().slice(-6));
  call('createProduct', STATE.token, { article: article, name: row.name.trim() || row.rawName }).then(function () {
    toast('Товар додано в базу — тепер можна зіставити позицію');
    STATE_INVOICE_REVIEW[i].article = article;
    STATE_INVOICE_REVIEW[i].matched = true;
    loadProducts(); // оновлюємо загальний список товарів у пам'яті
    renderInvoiceReview_();
  }).catch(function (e) { toast(e.message, true); });
}

(document.getElementById('confirmInvoiceReviewBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  var toAdd = STATE_INVOICE_REVIEW.filter(function (r) { return r.include && r.article.trim(); });
  if (!toAdd.length) return toast('Позначте хоча б одну позицію з артикулом', true);
  toAdd.forEach(function (item) {
    var existing = STATE_PO_ITEMS.find(function (r) { return String(r.article || '').toLowerCase() === item.article.toLowerCase(); });
    if (existing) { existing.qty = (Number(existing.qty) || 0) + item.qty; }
    else { STATE_PO_ITEMS.push({ article: item.article, name: item.name, qty: item.qty }); }
  });
  renderPoItemsList_();
  closeModal('invoiceReviewModal');
  toast('Додано в заявку: ' + toAdd.length + ' позицій');
});

/* ---------- Довідник (плаваючий чат) ---------- */
/* ---------- Голосовий режим (безперервний діалог, Web Speech API) ---------- */
var VOICE_MODE_ACTIVE_ = false;
var VOICE_RECOGNITION_ = null;
var VOICE_UK_VOICE_ = null;

(function () {
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById('helpChatMicBtn');
  var voiceToggleBtn = document.getElementById('voiceModeToggleBtn');
  if (!SpeechRec) {
    if (micBtn) micBtn.style.display = 'none';
    if (voiceToggleBtn) voiceToggleBtn.style.display = 'none';
    return;
  }

  VOICE_RECOGNITION_ = new SpeechRec();
  VOICE_RECOGNITION_.lang = 'uk-UA';
  VOICE_RECOGNITION_.interimResults = false;
  VOICE_RECOGNITION_.maxAlternatives = 1;

  // Знаходимо український голос для відповіді (якщо є в системі браузера).
  function pickUkVoice() {
    var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    VOICE_UK_VOICE_ = voices.find(function (v) { return v.lang === 'uk-UA'; }) || voices.find(function (v) { return v.lang && v.lang.indexOf('uk') === 0; }) || null;
  }
  pickUkVoice();
  if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = pickUkVoice;

  var listening = false;
  function startListening() {
    if (listening) return;
    try { VOICE_RECOGNITION_.start(); listening = true; updateMicVisual_(true); }
    catch (e) { /* вже слухає або немає дозволу */ }
  }
  function updateMicVisual_(active) {
    if (micBtn) { micBtn.classList.toggle('mic-active', active); micBtn.textContent = active ? '🔴' : '🎤'; }
  }

  micBtn.addEventListener('click', function () {
    if (listening) { VOICE_RECOGNITION_.stop(); return; }
    startListening();
  });

  voiceToggleBtn.addEventListener('click', function () {
    VOICE_MODE_ACTIVE_ = !VOICE_MODE_ACTIVE_;
    voiceToggleBtn.textContent = VOICE_MODE_ACTIVE_ ? '🔊' : '🔇';
    voiceToggleBtn.title = VOICE_MODE_ACTIVE_ ? 'Голосовий режим увімкнено — відповіді читаються вголос' : 'Голосовий режим вимкнено';
    toast(VOICE_MODE_ACTIVE_ ? 'Голосовий режим увімкнено — говоріть, Gemini відповість голосом' : 'Голосовий режим вимкнено — звичайний текстовий чат');
    if (VOICE_MODE_ACTIVE_) startListening();
  });

  VOICE_RECOGNITION_.onresult = function (e) {
    var text = e.results[0][0].transcript;
    document.getElementById('helpChatInput').value = text;
    sendHelpChatMessage_();
  };
  VOICE_RECOGNITION_.onerror = function (e) {
    if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Помилка розпізнавання мовлення: ' + e.error, true);
  };
  VOICE_RECOGNITION_.onend = function () {
    listening = false;
    updateMicVisual_(false);
    // У безперервному голосовому режимі — після завершення озвучення відповіді
    // (див. speakText_) автоматично слухаємо далі, без повторного натискання.
  };
})();

function speakText_(text) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel(); // не накладаємо кілька відповідей одна на одну
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'uk-UA';
  if (VOICE_UK_VOICE_) utter.voice = VOICE_UK_VOICE_;
  utter.rate = 1.0;
  utter.onend = function () {
    // Продовжуємо безперервний діалог — знову слухаємо користувача.
    if (VOICE_MODE_ACTIVE_ && VOICE_RECOGNITION_) {
      try { VOICE_RECOGNITION_.start(); } catch (e) {}
    }
  };
  window.speechSynthesis.speak(utter);
}

(document.getElementById('helpChatBubble') || {addEventListener:function(){}}).addEventListener('click', function () {
  document.getElementById('helpChatPanel').classList.toggle('hidden');
});
(document.getElementById('closeHelpChatBtn') || {addEventListener:function(){}}).addEventListener('click', function () {
  document.getElementById('helpChatPanel').classList.add('hidden');
});
var HELP_CHAT_HISTORY_ = null;
var HELP_CHAT_ATTACHED_FILE_ = null; // {base64, mimeType, name}
(document.getElementById('helpChatFileInput') || {addEventListener:function(){}}).addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    HELP_CHAT_ATTACHED_FILE_ = { base64: reader.result.split(',')[1], mimeType: file.type, name: file.name };
    var nameEl = document.getElementById('helpChatAttachedFileName');
    nameEl.textContent = '📎 ' + file.name + ' (буде надіслано з наступним повідомленням)';
    nameEl.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

function sendHelpChatMessage_() {
  var input = document.getElementById('helpChatInput');
  var question = input.value.trim();
  var attachedFile = HELP_CHAT_ATTACHED_FILE_;
  if (!question && !attachedFile) return;
  if (!question) question = 'Проаналізуй цей документ і скажи, що в ньому важливого.';
  var messages = document.getElementById('helpChatMessages');
  messages.innerHTML += '<div class="help-msg user">' + (attachedFile ? '📎 ' + escapeHtml(attachedFile.name) + '<br>' : '') + escapeHtml(question) + '</div>';
  input.value = '';
  document.getElementById('helpChatAttachedFileName').classList.add('hidden');
  document.getElementById('helpChatFileInput').value = '';
  HELP_CHAT_ATTACHED_FILE_ = null;
  messages.scrollTop = messages.scrollHeight;

  var loadingId = 'helpLoading' + Date.now();
  messages.innerHTML += '<div class="help-msg ai muted" id="' + loadingId + '">🤖 Думає (може перевіряти дані в системі)...</div>';
  messages.scrollTop = messages.scrollHeight;

  call('askFullAssistant', STATE.token, question, HELP_CHAT_HISTORY_, attachedFile ? attachedFile.base64 : null, attachedFile ? attachedFile.mimeType : null).then(function (res) {
    HELP_CHAT_HISTORY_ = res.history;
    var loadingEl = document.getElementById(loadingId);
    if (res.pendingConfirmation) {
      var confirmId = 'aiConfirm' + Date.now();
      if (loadingEl) loadingEl.outerHTML =
        '<div class="help-msg ai ai-confirm-card" id="' + confirmId + '">' +
        '⚠️ <strong>Потребує підтвердження:</strong><br>' + escapeHtml(res.pendingConfirmation.description) +
        '<div class="ai-confirm-buttons">' +
        '<button class="btn btn-primary btn-small" onclick="confirmAiPendingAction_(\'' + confirmId + '\')">✅ Підтвердити</button>' +
        '<button class="btn btn-secondary btn-small" onclick="cancelAiPendingAction_(\'' + confirmId + '\')">✕ Скасувати</button>' +
        '</div></div>';
      document.getElementById(confirmId).dataset.action = res.pendingConfirmation.action;
      document.getElementById(confirmId).dataset.args = JSON.stringify(res.pendingConfirmation.args);
    } else {
      var answerHtml = escapeHtml(res.answer).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
      if (loadingEl) loadingEl.outerHTML = '<div class="help-msg ai">' + answerHtml + '</div>';
    }
    messages.scrollTop = messages.scrollHeight;
    if (VOICE_MODE_ACTIVE_) speakText_(res.pendingConfirmation ? res.pendingConfirmation.description : res.answer);
  }).catch(function (e) {
    var loadingEl = document.getElementById(loadingId);
    if (loadingEl) loadingEl.outerHTML = '<div class="help-msg ai">⚠️ ' + escapeHtml(e.message) + '</div>';
  });
}
(document.getElementById('helpChatSendBtn') || {addEventListener:function(){}}).addEventListener('click', sendHelpChatMessage_);
function confirmAiPendingAction_(cardId) {
  var card = document.getElementById(cardId);
  var action = card.dataset.action;
  var args = JSON.parse(card.dataset.args);
  card.innerHTML = '<div class="muted">Виконую...</div>';
  call('confirmAiAction', STATE.token, action, args).then(function () {
    card.outerHTML = '<div class="help-msg ai">✅ Дію виконано.</div>';
    document.getElementById('helpChatMessages').scrollTop = 999999;
  }).catch(function (e) {
    card.outerHTML = '<div class="help-msg ai">⚠️ Помилка: ' + escapeHtml(e.message) + '</div>';
  });
}
function cancelAiPendingAction_(cardId) {
  document.getElementById(cardId).outerHTML = '<div class="help-msg ai muted">Дію скасовано.</div>';
}
(document.getElementById('helpChatInput') || {addEventListener:function(){}}).addEventListener('keydown', function (e) {
  if (e.key === 'Enter') sendHelpChatMessage_();
});

loadAndApplyBranding_();
boot();
</script>
